<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Белая кровь — опенинг</title>
<style>
  @font-face { font-family: 'Oswald'; src: url('fonts/oswald.ttf') format('truetype'); font-weight: 200 700; }
  @font-face { font-family: 'Cormorant'; src: url('fonts/cormorant.ttf') format('truetype'); font-weight: 300 700; }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
// Anime opening «Хроники рода Эльтар — Белая кровь». Style 22 (Anime OP / manga panels) from the motion-design skill.
// Contract for render.mjs: window.DEMO, window.renderAt(t) (pure function of t), window.__ready.
import { E, seg, clamp, lerp, spring, rng, hash, noise1, makeCanvas, makeGrain, loadCues, TAU } from './mg.js';

const cues = await loadCues('./cues.json');
const A = cues.at;
const { width: W, height: H, fps: FPS, duration: D } = cues;
const BEAT = 60 / cues.bpm;
window.DEMO = { width: W, height: H, fps: FPS, duration: D };

const stage = document.getElementById('stage');
const ctx = makeCanvas(W, H, stage);
ctx.imageSmoothingQuality = 'high';
const grain = makeGrain(256, 5);

// ---------- palette: the red world of Eltarion vs white blood ----------
const C = { ink: '#0B0708', deep: '#3E0907', red: '#B3261E', ember: '#FF6A3A', bone: '#F5F0E6', gold: '#E3C88E', fire: '#6272FF' };
const OSW = 'Oswald, "DejaVu Sans", sans-serif', COR = 'Cormorant, "DejaVu Serif", serif';
await Promise.all([document.fonts.load(`700 100px ${OSW}`, 'ЛИАМ ЭЛЬТАР'), document.fonts.load(`600 60px ${COR}`, 'ХРОНИКИ РОДА')]);

// ---------- assets (prepared by tools/prep_assets.py from the book's character cards) ----------
const FILES = { bg_desert: 'jpg', bg_capital: 'jpg', bg_zerr: 'jpg', bg_cliff: 'jpg', liam_back: 'jpg', liam_profile: 'jpg',
  lord_face: 'jpg', diana: 'jpg', meph: 'jpg', cyan: 'jpg', sebastian: 'jpg', kris: 'jpg', nox: 'jpg', alastor: 'jpg', logo: 'jpg',
  dragon_fly: 'png', dragon_head: 'png', sword: 'png', emblem: 'png', rukh_fly: 'png' };
const IM = {};
await Promise.all(Object.entries(FILES).map(async ([n, ext]) => { const im = new Image(); im.src = `assets/${n}.${ext}`; await im.decode(); IM[n] = im; }));
// mirrored Liam (back view turned to face right, toward the Dragon Lord in the clash)
const liamMirror = (() => { const c = document.createElement('canvas'); c.width = IM.liam_back.width; c.height = IM.liam_back.height;
  const g = c.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(IM.liam_back, 0, 0); return c; })();
// offscreen buffer for the logo light-sweep
const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const bctx = buf.getContext('2d');

// ---------- helpers ----------
function cover(im, x, y, w, h, zoom = 1, fx = 0.5, fy = 0.5, ox = 0, oy = 0) {
  const s = Math.max(w / im.width, h / im.height) * zoom, iw = im.width * s, ih = im.height * s;
  const dx = clamp(x + w / 2 - fx * iw + ox, x + w - iw, x), dy = clamp(y + h / 2 - fy * ih + oy, y + h - ih, y);
  ctx.drawImage(im, dx, dy, iw, ih);
}
function path(P, c = ctx) { c.beginPath(); c.moveTo(P[0][0], P[0][1]); for (let i = 1; i < P.length; i++) c.lineTo(P[i][0], P[i][1]); c.closePath(); }
function bbox(P) { const xs = P.map(p => p[0]), ys = P.map(p => p[1]); return [Math.min(...xs), Math.min(...ys), Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)]; }
// manga panel: clip to polygon, draw content, black gutter + thin bone inner line
function panel(P, draw, gutter = 16) {
  ctx.save(); path(P); ctx.clip(); draw(bbox(P)); ctx.restore();
  ctx.save(); path(P); ctx.lineJoin = 'miter'; ctx.strokeStyle = C.ink; ctx.lineWidth = gutter; ctx.stroke();
  ctx.strokeStyle = 'rgba(245,240,230,0.85)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
}
const shift = (P, dx, dy) => P.map(([x, y]) => [x + dx, y + dy]);
// radial focus lines (refreshed on twos → hand-drawn feel)
function radial(cx, cy, t, { n = 90, rgb = '255,255,255', a = 0.45, r0 = 380, seed = 1, w = 0.006 } = {}) {
  const r = rng(seed * 997 + Math.floor(t * FPS / 2));
  ctx.save(); ctx.fillStyle = `rgba(${rgb},${a})`;
  for (let i = 0; i < n; i++) {
    const ang = r() * TAU, inner = r0 + r() * 340, ww = w * (0.35 + r() * 1.3);
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(ang) * inner, cy + Math.sin(ang) * inner);
    ctx.lineTo(cx + Math.cos(ang - ww) * 2600, cy + Math.sin(ang - ww) * 2600); ctx.lineTo(cx + Math.cos(ang + ww) * 2600, cy + Math.sin(ang + ww) * 2600); ctx.fill();
  }
  ctx.restore();
}
// horizontal motion streaks (wind, dust, speed)
function streaks(t, { n = 40, rgb = '255,255,255', a = 0.3, seed = 2, speed = 2400, dir = 1, len = [80, 420], thick = [1, 3], yr = [0, H] } = {}) {
  const r = rng(seed); ctx.save();
  for (let i = 0; i < n; i++) {
    const y = lerp(yr[0], yr[1], r()), L = lerp(len[0], len[1], r()), th = lerp(thick[0], thick[1], r()), sp = speed * (0.6 + r() * 0.8), ph = r() * (W + L);
    let x = ((ph + t * sp) % (W + L)) - L; if (dir < 0) x = W - x - L;
    const g = ctx.createLinearGradient(x, 0, x + L, 0);
    g.addColorStop(0, `rgba(${rgb},0)`); g.addColorStop(dir > 0 ? 1 : 0, `rgba(${rgb},${a * (0.4 + r() * 0.6)})`); g.addColorStop(dir > 0 ? 0 : 1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.fillRect(x, y, L, th);
  }
  ctx.restore();
}
// seeded particles rising (embers / motes)
function embers(t, { n = 70, rgb = '255,106,58', a = 0.8, seed = 9, rise = 60, size = [1, 3.5], glow = 10 } = {}) {
  const r = rng(seed); ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const x0 = r() * W, y0 = r() * H, v = rise * (0.5 + r()), s = lerp(size[0], size[1], r()), ph = r() * 10;
    const y = ((y0 - t * v) % (H + 40) + H + 40) % (H + 40) - 20, x = x0 + Math.sin(t * 0.9 + ph) * 18;
    const fl = 0.55 + 0.45 * Math.sin(t * 7 + ph * 3);
    ctx.globalAlpha = a * fl; ctx.fillStyle = `rgb(${rgb})`; ctx.shadowColor = `rgb(${rgb})`; ctx.shadowBlur = glow;
    ctx.beginPath(); ctx.arc(x, y, s, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function glow(cx, cy, r, color) { const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r); }
function drop(x, y, r, stretch = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1 / Math.sqrt(stretch), stretch);
  ctx.fillStyle = '#FFFFFF'; ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.moveTo(0, -r * 2.3); ctx.quadraticCurveTo(r * 1.15, -r * 0.2, 0, r); ctx.quadraticCurveTo(-r * 1.15, -r * 0.2, 0, -r * 2.3); ctx.fill();
  ctx.restore();
}
function text(s, x, y, { font = OSW, size = 100, weight = 700, fill = C.bone, stroke = null, sw = 0, track = 0, align = 'left', alpha = 1 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = `${track}px`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  const xx = align === 'center' ? x + track / 2 : x;
  if (stroke) { ctx.lineJoin = 'round'; ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.strokeText(s, xx, y); }
  if (fill) { ctx.fillStyle = fill; ctx.fillText(s, xx, y); }
  ctx.restore();
}
function measure(s, size, weight = 700, font = OSW, track = 0) { ctx.save(); ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = `${track}px`; const w = ctx.measureText(s).width; ctx.restore(); return w; }
// anime name plate: slanted ink bar grows, the name slides in under a clip, a red underline, a small latin sub
function nameplate(name, sub, x, y, t0, t, { size = 110, align = 'left', sub2 = null } = {}) {
  const p = seg(t, t0, t0 + 0.22, E.out); if (p <= 0) return;
  const w = measure(name, size, 700, OSW, size * 0.04) + 60, h = size * 1.12, sl = h * 0.28;
  const x0 = align === 'right' ? x - w : x;
  ctx.save(); ctx.globalAlpha = 0.88; ctx.fillStyle = C.ink;
  const bw = w * p; const bx = align === 'right' ? x0 + w - bw : x0;
  path([[bx + sl, y - h], [bx + bw + sl, y - h], [bx + bw, y], [bx, y]]); ctx.fill(); ctx.restore();
  ctx.fillStyle = C.red; ctx.fillRect(bx, y + 4, bw, 7);
  ctx.save(); path([[bx + sl, y - h], [bx + bw + sl, y - h], [bx + bw, y], [bx, y]]); ctx.clip();
  const q = seg(t, t0 + 0.05, t0 + 0.35, E.out);
  text(name, x0 + 30 + (1 - q) * -60, y - h * 0.17, { size, track: size * 0.04, alpha: q });
  ctx.restore();
  if (sub) { const s = seg(t, t0 + 0.18, t0 + 0.6, E.out); text(sub, align === 'right' ? x : x0 + 4, y + 52, { font: COR, size: 34, weight: 600, fill: C.gold, track: 10, align: align === 'right' ? 'right' : 'left', alpha: s }); }
}
// diagonal ink wipe centred on tc (covers the frame exactly at tc)
function diagWipe(t, tc, d = 0.16, color = C.ink) {
  const p = (t - (tc - d)) / (2 * d); if (p <= 0 || p >= 1) return;
  const sl = 420, Lx = p < 0.5 ? -sl - 40 : lerp(-sl - 40, W + 40, E.inOut((p - 0.5) * 2)), Rx = p < 0.5 ? lerp(-sl - 40, W + sl + 40, E.inOut(p * 2)) : W + sl + 40;
  ctx.fillStyle = color; path([[Lx + sl, 0], [Rx + sl, 0], [Rx, H], [Lx, H]]); ctx.fill();
  ctx.fillStyle = C.red; path([[Rx + sl, 0], [Rx + sl + 26, 0], [Rx + 26, H], [Rx, H]]); ctx.fill();
}

// ---------- hits: flash / inverted impact frames / shake ----------
const HITS = [
  { t: A.splash, flash: 0.95 },
  { t: A.desert, flash: 0.35 }, { t: A.liamBack, flash: 0.45, shake: 4 },
  { t: A.liam, inv: 2, shake: 18 }, { t: A.liam + 2 * BEAT, shake: 5 },
  { t: A.lord, shake: 8 }, { t: A.lordPunch, inv: 1, shake: 10 },
  { t: A.trio, shake: 7 }, { t: A.trio + BEAT, shake: 6 }, { t: A.trio + 2 * BEAT, shake: 6 }, { t: A.trio + 3 * BEAT, flash: 0.35 },
  { t: A.quad, shake: 8 }, { t: A.quad + BEAT, shake: 8 }, { t: A.quad + 2 * BEAT, shake: 8 }, { t: A.quad + 3 * BEAT, shake: 10 },
  { t: A.zerr, flash: 0.5, shake: 6 }, { t: A.rukh, flash: 0.3 },
  { t: A.storm, shake: 6 }, { t: 12.36, flash: 0.55 }, { t: 12.6, flash: 0.35 }, { t: A.dragonHead, shake: 24 },
  { t: A.clash, inv: 3, flash: 1, shake: 30 },
  { t: A.sword, flash: 0.4 },
  { t: A.dropHit, flash: 1 },
];
function shakeAt(t) {
  let x = 0, y = 0; const f = Math.floor(t * FPS);
  for (const h of HITS) if (h.shake && t >= h.t) { const amp = h.shake * Math.exp(-(t - h.t) * 9); if (amp > 0.25) { x += (hash(f, h.t * 13) - 0.5) * 2 * amp; y += (hash(f, h.t * 17 + 1) - 0.5) * 2 * amp; } }
  return [x, y];
}
// beat bounce in the driving section (drop → storm)
function bounce(t) {
  if (t < A.liam || t >= A.storm) return 1;
  const k = (t - A.liam) % BEAT; return 1 + 0.012 * Math.exp(-k * 14);
}

// ================= scenes =================
function s0(t) { // hook: a drop of white blood falls, splashes, the Eltar emblem blooms
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  const g = seg(t, A.splash, A.splash + 0.6, E.out);
  if (g > 0) glow(960, 540, 900, `rgba(179,38,30,${0.55 * g})`);
  if (t >= A.splash) {
    const p = seg(t, A.splash, A.splash + 0.7, E.out), s = lerp(0.8, 1, p), h = 860 * s, w = h * IM.emblem.width / IM.emblem.height;
    ctx.save(); ctx.globalAlpha = p; ctx.shadowColor = 'rgba(227,200,142,0.7)'; ctx.shadowBlur = 34; ctx.drawImage(IM.emblem, 960 - w / 2, 540 - h / 2, w, h); ctx.restore();
    for (let i = 0; i < 3; i++) { const q = seg(t, A.splash + i * 0.08, A.splash + i * 0.08 + 0.9, E.out); if (q <= 0 || q >= 1) continue;
      ctx.strokeStyle = `rgba(255,255,255,${(1 - q) * 0.9})`; ctx.lineWidth = 3 - i * 0.7; ctx.beginPath(); ctx.ellipse(960, 560, 30 + q * (980 - i * 160), (30 + q * (980 - i * 160)) * 0.22, 0, 0, TAU); ctx.stroke(); }
  } else {
    const p = seg(t, 0, A.splash, E.in);
    glow(960, 540, 700, `rgba(179,38,30,${0.18 + 0.2 * p})`);
    drop(960, lerp(170, 560, p), 21, 1 + p * 0.6);
    ctx.strokeStyle = `rgba(255,255,255,${0.25 * (1 - p)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(960, 0); ctx.lineTo(960, lerp(150, 520, p)); ctx.stroke();
  }
}
function s1(t) { // Eltarion: the red desert, revealed through an iris from the emblem
  const ir = seg(t, A.desert, A.desert + 0.42, E.out) * 1250;
  if (ir < 1240) s0(t);
  ctx.save(); ctx.beginPath(); ctx.arc(960, 540, ir, 0, TAU); ctx.clip();
  cover(IM.bg_desert, 0, 0, W, H, lerp(1.2, 1.05, seg(t, A.desert, A.liamBack, E.out)), 0.62, 0.42);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0.45, 'rgba(20,4,4,0)'); g.addColorStop(1, 'rgba(20,4,4,0.75)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  streaks(t, { n: 46, rgb: '255,200,160', a: 0.22, speed: 700, len: [120, 520], thick: [1, 2.5], yr: [380, 1080], seed: 4 });
  const e = 1 - seg(t, A.desert, A.desert + 0.6, E.out);
  if (e > 0) { const h = 860 * lerp(1.6, 1, e), w = h * IM.emblem.width / IM.emblem.height; ctx.globalAlpha = e * 0.8; ctx.drawImage(IM.emblem, 960 - w / 2, 540 - h / 2, w, h); ctx.globalAlpha = 1; }
  const q = seg(t, 1.15, 1.75, E.out);
  if (q > 0) {
    text('ЭЛЬТАРИОН', 960, 905 + (1 - q) * 18, { font: COR, size: 76, weight: 600, track: 34, align: 'center', alpha: q, fill: C.bone });
    ctx.fillStyle = `rgba(227,200,142,${q})`; const hl = 170 * q; ctx.fillRect(960 - 360 - hl, 878, hl, 1.5); ctx.fillRect(960 + 360, 878, hl, 1.5);
    text('КРАСНЫЕ ПЕСКИ', 960, 960, { font: COR, size: 30, weight: 600, track: 16, align: 'center', alpha: seg(t, 1.35, 1.9, E.out), fill: C.gold });
  }
  ctx.restore();
}
function s2(t) { // build: Liam from behind, the camera accelerates into him
  const p = seg(t, A.liamBack, A.liam, E.in);
  cover(IM.liam_back, 0, 0, W, H, lerp(1.0, 1.28, p), 0.5, 0.36);
  ctx.save(); ctx.globalCompositeOperation = 'multiply';
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#E8E4EE'); g.addColorStop(0.55, '#E9B8AE'); g.addColorStop(1, '#8E2016');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  streaks(t, { n: 30, rgb: '255,255,255', a: 0.15 + 0.35 * p, speed: 1800 + 3000 * p, dir: -1, len: [200, 700], thick: [1, 2], seed: 7 });
  embers(t, { n: 40, rgb: '255,255,255', a: 0.55, rise: 50, size: [0.8, 2.2], glow: 8, seed: 21 });
  const c = seg(t, A.liamBack + 0.25, A.liamBack + 0.85, E.out);
  text('по книге «Хроники рода Эльтар. Белая кровь»', 1810, 990, { font: COR, size: 38, weight: 600, fill: C.bone, track: 3, align: 'right', alpha: c * (1 - seg(t, 3.55, 3.75)) });
  const f = seg(t, A.liam - 0.2, A.liam, E.in); if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${f})`; ctx.fillRect(0, 0, W, H); }
}
function s3(t) { // DROP — Liam Eltar
  ctx.fillStyle = C.deep; ctx.fillRect(0, 0, W, H);
  radial(1380, 430, t, { n: 110, a: 0.22, r0: 260, seed: 3 });
  text('ЛИАМ', -40 - (t - A.liam) * 40, 860, { size: 560, weight: 700, fill: null, stroke: 'rgba(255,255,255,0.08)', sw: 3, track: 10 });
  const en = seg(t, A.liam, A.liam + 0.26, E.out), ox = lerp(1100, 0, en);
  const P = shift([[1060, -30], [1950, -30], [1950, 1110], [850, 1110]], ox, 0);
  panel(P, ([x, y, w, h]) => { ctx.fillStyle = '#EFEAE2'; ctx.fillRect(x, y, w, h); cover(IM.liam_profile, x, y, w, h, lerp(1.12, 1.02, seg(t, A.liam, A.lord, E.out)), 0.47, 0.3, -(t - A.liam) * 14, 0); });
  ctx.fillStyle = C.red; path(shift([[1030, -30], [1052, -30], [842, 1110], [820, 1110]], ox * 1.1, 0)); ctx.fill();
  // name
  const n1 = seg(t, A.liam + 0.06, A.liam + 0.36, E.out), n2 = seg(t, A.liam + 0.16, A.liam + 0.46, E.out);
  text('ЛИАМ', 120 + (1 - n1) * -220, 520, { size: 250, fill: C.bone, track: 8, alpha: n1 });
  text('ЭЛЬТАР', 128 + (1 - n2) * -220, 690, { size: 150, fill: null, stroke: C.bone, sw: 3, track: 22, alpha: n2 });
  const s = seg(t, A.liam + 0.32, A.liam + 0.8, E.out);
  ctx.fillStyle = `rgba(179,38,30,${s})`; ctx.fillRect(128, 728, 320 * s, 8);
  text('LIAM ELTAR', 128, 800, { font: COR, size: 40, weight: 600, fill: C.gold, track: 18, alpha: s });
}
function s4(t) { // the Dragon Lord
  const z = lerp(1.04, 1.13, seg(t, A.lord, A.trio, E.inOut)) + 0.07 * seg(t, A.lordPunch, A.lordPunch + 0.12, E.out) - 0.03 * seg(t, A.lordPunch + 0.12, A.trio, E.out);
  cover(IM.lord_face, 0, 0, W, H, z, 0.36, 0.44);
  ctx.save(); ctx.globalCompositeOperation = 'multiply';
  const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, '#E9E2E2'); g.addColorStop(0.5, '#D9A49B'); g.addColorStop(0.68, '#A3271B'); g.addColorStop(1, '#5A0D09');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  if (t >= A.lordPunch) streaks(t, { n: 26, rgb: '10,4,4', a: 0.55 * (1 - seg(t, A.lordPunch, A.lordPunch + 0.5)), speed: 5200, len: [300, 900], thick: [2, 5], seed: 31 });
  nameplate('ПОВЕЛИТЕЛЬ', null, 1840, 720, A.lord + 0.1, t, { size: 118, align: 'right' });
  nameplate('ДРАКОНОВ', null, 1800, 870, A.lord + 0.22, t, { size: 118, align: 'right' });
  const s = seg(t, A.lord + 0.5, A.lord + 0.9, E.out);
  text('THE DRAGON LORD', 1800, 940, { font: COR, size: 36, weight: 600, fill: C.gold, track: 16, align: 'right', alpha: s });
}
const TRIO = [
  { im: 'diana', name: 'ДИАНА ЭЛЬТАР', fx: 0.5, fy: 0.33, P: [[-30, -30], [690, -30], [560, 1110], [-30, 1110]], dir: 1 },
  { im: 'meph', name: 'МЕФ', fx: 0.42, fy: 0.36, P: [[690, -30], [1350, -30], [1220, 1110], [560, 1110]], dir: -1 },
  { im: 'cyan', name: 'ЦИАН', fx: 0.48, fy: 0.36, P: [[1350, -30], [1950, -30], [1950, 1110], [1220, 1110]], dir: 1 },
];
function s5(t) { // trio of manga panels, one per beat
  ctx.fillStyle = C.red; ctx.fillRect(0, 0, W, H); radial(960, 540, t, { n: 80, rgb: '62,9,7', a: 0.6, r0: 120, seed: 5 });
  const push = 1 + 0.035 * seg(t, A.trio + 3 * BEAT, A.quad, E.out);
  ctx.save(); ctx.translate(960, 540); ctx.scale(push, push); ctx.translate(-960, -540);
  TRIO.forEach((c, i) => {
    const t0 = A.trio + i * BEAT; if (t < t0) return;
    const p = seg(t, t0, t0 + 0.26, E.back), oy = (1 - p) * 1150 * c.dir;
    const P = shift(c.P, 0, oy);
    panel(P, ([x, y, w, h]) => { ctx.fillStyle = '#F1ECE4'; ctx.fillRect(x, y, w, h); cover(IM[c.im], x, y, w, h, lerp(1.1, 1.0, seg(t, t0, t0 + 1.4, E.out)), c.fx, c.fy); });
    const [bx, , bw] = bbox(c.P);
    nameplate(c.name, null, bx + 40 + (i === 2 ? 60 : 0), 1010, t0 + 0.12, t, { size: 64 });
  });
  ctx.restore();
