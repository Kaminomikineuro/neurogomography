<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<title>Фабрика Чисел</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#10182b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Russo+One&display=swap">
<style>
/* Layout: one-screen toy-factory console — control bar on top, play floor in the middle, narrator strip with Пуфик at the bottom */
:root{
  --bg:#10182b; --bg2:#182447; --panel:#1f2c4d; --panel-hi:#2a3b64; --line:#3a5288;
  --fg:#f4f7ff; --muted:#a9b8de; --paper:#f4f7ff; --ink:#18213d; --ink-soft:#7183b5; --paper-sh:#9aa9cf;
  --blue:#2f7bff; --blue-dk:#1a4fc2; --blue-lt:#8cc0ff;
  --red:#ff3d5a; --red-dk:#b81d36;
  --yellow:#ffc928; --yellow-dk:#c28e00;
  --pink:#ff6fb0; --pc:#ff9a2e; --green:#25c97a; --green-dk:#128650; --orange:#ff9a2e;
  --display:'Russo One','Arial Black',Impact,system-ui,sans-serif;
  --body:'Nunito','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:800;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}

#app{position:relative;height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 60% at 50% -12%,#2a4a8c 0%,transparent 62%),linear-gradient(var(--bg2),var(--bg) 70%)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px),
  radial-gradient(circle,rgba(255,255,255,.08) 2.5px,transparent 3px);
  background-size:120px 120px,120px 120px,120px 120px;background-position:0 0,0 0,8px 8px}
#app::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;opacity:.22;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px)}

/* top bar */
#bar{position:relative;z-index:5;display:flex;align-items:center;gap:8px;height:62px;flex:none}
#bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;border-radius:3px;opacity:.75;
  background:repeating-linear-gradient(-45deg,var(--yellow) 0 10px,#151515 10px 20px)}
.ib{width:48px;height:48px;border-radius:14px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;color:var(--fg);flex:none;box-shadow:0 4px 0 #0a1020}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1020}
.ib svg{width:26px;height:26px}
#prog{flex:1;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
#prog i{width:16px;height:16px;border-radius:50%;background:#0b1224;border:2px solid var(--line);transition:background .3s,box-shadow .3s,transform .3s}
#prog i.on{background:var(--yellow);border-color:#fff3b0;box-shadow:0 0 10px var(--yellow);transform:scale(1.15)}

/* stage */
#stage{position:relative;flex:1;min-height:0;z-index:2}
#view{position:absolute;inset:0}
#grab{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding-block:10px;overflow:hidden}
.screen.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* narrator strip */
#sub{position:relative;z-index:5;flex:none;display:flex;align-items:center;gap:10px;height:58px;padding-block:4px;text-align:left;width:100%}
#sub .pufik{height:50px;width:auto;flex:none}
#subt{flex:1;min-width:0;font-size:15px;line-height:1.25;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Pufik */
.pufik{display:block;overflow:visible}
.pufik .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.pufik .mouth{transform-box:fill-box;transform-origin:50% 15%}
.talking .pufik .mouth{animation:talk .17s ease-in-out infinite alternate}
.pufik .armR{transform-box:fill-box;transform-origin:0 0}
.pufik .armL{transform-box:fill-box;transform-origin:100% 0}
.pufik.wave .armR{animation:waveR 1.3s ease-in-out infinite}
.pufik.dance{animation:hop .45s ease-in-out infinite alternate}
.pufik.dance .armR{animation:waveR .45s ease-in-out infinite alternate}
.pufik.dance .armL{animation:waveL .45s ease-in-out infinite alternate}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes talk{from{transform:scaleY(1)}to{transform:scaleY(.5)}}
@keyframes waveR{50%{transform:rotate(-38deg)}}
@keyframes waveL{50%{transform:rotate(38deg)}}
@keyframes hop{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-14px) rotate(3deg)}}

/* shared bits */
.logo{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.95;margin:0;color:var(--yellow);
  font-size:clamp(34px,9vw,64px);letter-spacing:.02em;text-shadow:3px 3px 0 var(--red),6px 6px 0 #0a0f1e;text-align:center;text-wrap:balance}
.logo.sm{font-size:clamp(26px,7vw,44px)}
.btn{display:inline-grid;place-items:center;min-width:76px;height:76px;padding:0 18px;border-radius:24px;background:var(--yellow);color:#3a2600;
  font-family:var(--display);font-size:32px;box-shadow:0 7px 0 var(--yellow-dk),0 12px 20px rgba(0,0,0,.35)}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--yellow-dk)}
.btn svg{width:36px;height:36px}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 7px 0 var(--blue-dk),0 12px 20px rgba(0,0,0,.35)}
.btn.blue:active{box-shadow:0 2px 0 var(--blue-dk)}
.eq{display:flex;align-items:center;justify-content:center;gap:.28em;font-family:var(--display);font-size:clamp(26px,min(7vw,7vh),50px);flex:none}
.eq .op{color:var(--muted)}
.nbig{color:var(--yellow);font-weight:400;text-shadow:0 .07em 0 var(--red-dk),0 0 .4em rgba(255,201,40,.35);min-width:1.1em;text-align:center}
.nb{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;padding:0 .2em;border-radius:.3em;color:#fff;font-weight:400;box-shadow:0 .12em 0 rgba(0,0,0,.4)}
.nb.blue{background:var(--blue)}
.nb.red{background:var(--red)}
.bump{animation:bump .35s}
.dots{display:grid;grid-template-columns:repeat(var(--cols),var(--d,7px));gap:calc(var(--d,7px)*.45);justify-content:center}
.dots i{display:block;width:var(--d,7px);height:var(--d,7px);border-radius:50%;background:currentColor}
.dots i:nth-child(n+11):nth-child(-n+15){margin-top:calc(var(--d,7px)*.7)}
.slots{--s:clamp(14px,min(4.6vw,4.2vh),28px);display:grid;grid-template-columns:repeat(var(--cols),var(--s));gap:5px;justify-content:center}
.slots i{display:block;width:var(--s);height:var(--s);border-radius:50%;border:2.5px dashed var(--muted)}
.slots i.b{background:var(--blue);border:2.5px solid var(--blue-lt)}
.slots i.r{background:var(--red);border:2.5px solid #ffb3c0;animation:pop .4s backwards}
.slots i:nth-child(n+11):nth-child(-n+15){margin-top:6px}
.hint{display:flex;justify-content:center;flex:none}
.hint:empty{display:none}
.toy{display:grid;place-items:center;width:var(--ts);height:var(--ts);font-size:calc(var(--ts)*.78);line-height:1;font-family:system-ui}
.glove-svg{display:block}

.answers{display:flex;justify-content:center;gap:clamp(8px,2.4vw,16px);flex-wrap:wrap;padding-bottom:6px;flex:none}
.ans{width:clamp(66px,20vw,124px);height:clamp(72px,min(21vw,17vh),124px);border-radius:20px;background:var(--paper);
  box-shadow:0 6px 0 var(--paper-sh),0 10px 16px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:transform .12s;animation:pop .35s backwards}
.ans:nth-child(2){animation-delay:.06s}.ans:nth-child(3){animation-delay:.12s}.ans:nth-child(4){animation-delay:.18s}
.ans b{font-family:var(--display);font-weight:400;font-size:clamp(30px,min(9vw,7vh),58px);line-height:1;color:var(--ink)}
.ans .dots{--d:clamp(4px,1.25vw,8px);color:var(--ink-soft)}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 var(--paper-sh)}
.ans.wrong{opacity:.35;filter:grayscale(1);animation:shake .4s}
.ans.right{background:var(--green);box-shadow:0 6px 0 var(--green-dk),0 0 24px rgba(37,201,122,.6)}
.ans.right b,.ans.right .dots{color:#fff}
.ans.pulse{animation:pulse 1s ease-in-out infinite}

/* start */
.start{align-items:center;justify-content:center;gap:clamp(10px,2.4vh,22px);text-align:center}
.pufik.hero{height:clamp(130px,32vh,280px);width:auto}
.play{width:clamp(96px,26vw,140px);height:clamp(96px,26vw,140px);border-radius:50%;background:var(--yellow);color:#3a2600;display:grid;place-items:center;
  box-shadow:0 8px 0 var(--yellow-dk),0 0 0 10px rgba(255,201,40,.16),0 0 46px rgba(255,201,40,.45);animation:breathe 1.6s ease-in-out infinite}
.play svg{width:46%;height:46%;margin-left:8%}
.play:active{transform:translateY(5px)}
.parent{font-size:13px;font-weight:700;color:var(--muted);max-width:40ch;margin:0;line-height:1.4}
.parent.warn{color:#ffd27a}

/* menu */
.menu{gap:14px}
.mhead{display:flex;align-items:center;justify-content:center;gap:14px;flex:none}
.pufik.mp{height:clamp(84px,17vh,150px);width:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:1000px;margin-inline:auto;flex:none}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;min-height:118px;border-radius:24px;
  background:linear-gradient(var(--panel-hi),var(--panel));border:3px solid var(--line);box-shadow:0 6px 0 #0a1020;animation:pop .4s backwards}
.tile:first-child{grid-column:1/-1;flex-direction:row;gap:14px}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #0a1020}
.tile .ic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:42px;background:var(--c);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);font-family:system-ui}
.tile .lbl{font-size:16px;color:var(--fg);letter-spacing:.02em}
.tile:nth-child(2){animation-delay:.05s}.tile:nth-child(3){animation-delay:.1s}.tile:nth-child(4){animation-delay:.15s}.tile:nth-child(5){animation-delay:.2s}
@media (min-width:700px){.tiles{grid-template-columns:repeat(5,1fr)}.tile:first-child{grid-column:auto;flex-direction:column}.tile{min-height:150px}}
.shelf{display:flex;align-items:center;gap:12px;background:#0c1428;border:3px solid var(--line);border-radius:18px;padding:8px 14px;width:100%;max-width:1000px;margin-inline:auto;flex:none}
.shelf-l{font-family:var(--display);color:var(--yellow);font-size:20px;white-space:nowrap}
.shelf-row{display:flex;flex-wrap:wrap;gap:2px;font-size:26px;min-width:0;font-family:system-ui}
.shelf-row .muted{font-size:14px;color:var(--muted);font-family:var(--body)}

/* picker */
.picker{gap:12px}
.ph{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-size:24px;flex:none}
.ph .ic{font-size:40px;font-family:system-ui}
.ngrid{display:grid;gap:10px;width:100%;max-width:900px;margin-inline:auto;flex:none}
.ngrid.big{grid-template-columns:repeat(3,1fr)}
.ngrid.small{grid-template-columns:repeat(5,1fr)}
@media (min-width:700px){.ngrid.big{grid-template-columns:repeat(9,1fr)}.ngrid.small{grid-template-columns:repeat(10,1fr)}}
.nbtn{position:relative;font-family:var(--display);color:#fff;background:var(--c);border-radius:20px;height:clamp(64px,12vh,92px);font-size:clamp(30px,8vw,46px);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),0 6px 0 rgba(0,0,0,.4);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.nbtn.s{height:clamp(50px,9vh,66px);font-size:clamp(20px,5.4vw,30px);border-radius:15px}
.nbtn:active{transform:translateY(4px);box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),0 2px 0 rgba(0,0,0,.4)}
.star{position:absolute;top:3px;right:7px;font-style:normal;font-size:.42em;color:var(--yellow);text-shadow:0 1px 0 #000}
.dicerow{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:900px;margin-inline:auto;flex:none}
.nbtn.dice{--c:#34447a;display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(26px,7vw,40px)}
.nbtn.dice small{font-size:.55em}
.nbtn.dice span{font-family:system-ui}

/* learn: baskets */
.trays{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tray{display:flex;flex-direction:column;align-items:center;min-height:0;gap:4px}
.tray>.glove-svg{width:38px;height:46px;flex:none}
.bin{flex:1;width:100%;min-height:0;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:4px;padding:10px;
  border-radius:14px 14px 30px 30px;border:4px solid var(--blue);background:linear-gradient(180deg,rgba(47,123,255,.08),rgba(47,123,255,.3));overflow:hidden}
.tray.red .bin{border-color:var(--red);background:linear-gradient(180deg,rgba(255,61,90,.08),rgba(255,61,90,.3))}
.bin .toy{cursor:pointer}
.bin .toy:active{transform:scale(.9)}
.foundrow{display:flex;align-items:center;justify-content:center;gap:12px;flex:none}
.found{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-width:0}
.chip{display:inline-flex;border-radius:10px;overflow:hidden;font-family:var(--display);font-size:clamp(14px,3.8vw,20px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.chip b{min-width:1.7em;padding:.2em .3em;text-align:center;color:#fff;font-weight:400}
.chip .cb{background:var(--blue)}
.chip .cr{background:var(--red)}
.chip.q{border:2px dashed var(--line);color:var(--muted);padding:.2em .9em;box-shadow:none}
.chip.new{animation:pop .5s backwards}
.btn.watch{height:56px;min-width:60px;font-size:28px;padding:0 12px;border-radius:18px;flex:none;font-family:system-ui}

/* hide: crate */
.scene{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:clamp(12px,3vw,30px)}
.grid5{display:grid;grid-template-columns:repeat(5,var(--ts));gap:4px;justify-items:center}
.crate{position:relative;width:clamp(110px,30vw,190px);height:clamp(86px,23vw,146px);border-radius:12px;flex:none;
  background:linear-gradient(180deg,#b9773d,#94592a);box-shadow:inset 0 0 0 5px #7a4720,0 8px 0 #5c3415}
.crate::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:16%;transform:translateX(-50%);background:rgba(255,230,170,.3)}
.crate .inside{position:absolute;inset:12px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1px;opacity:0;transition:opacity .3s .2s}
.crate.show .inside{opacity:1}
.toy.sm{width:auto;height:auto;font-size:clamp(15px,4.4vw,28px)}
.lid{position:absolute;inset:0;border-radius:12px;display:grid;place-items:center;opacity:0;transform:translateY(-70%) rotate(-12deg);
  background:linear-gradient(180deg,#d9a062,#b47a40);box-shadow:inset 0 0 0 5px #8b5527;transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .25s}
.crate.closed .lid{transform:none;opacity:1}
.lid span{font-family:var(--display);font-size:clamp(40px,11vw,72px);color:#5a3110;text-shadow:0 2px 0 rgba(255,255,255,.25)}

/* catch */
.machine{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,26px);flex-wrap:wrap;flex:none;
  background:linear-gradient(var(--panel-hi),var(--panel));border:3px solid var(--line);border-radius:20px;padding:8px 12px;box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.machine .eq{font-size:clamp(24px,min(6.5vw,6vh),44px)}
.field{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:20px;border:3px solid var(--line);
  background:linear-gradient(180deg,#0b1222,#152142);touch-action:none}
.pipes i{position:absolute;top:-4px;width:calc(var(--bs)*1.05);height:20px;transform:translateX(-50%);border-radius:0 0 14px 14px;
  background:linear-gradient(#5b688f,#2c3654);box-shadow:0 4px 0 #161c30}
.ball{position:absolute;left:0;top:0;width:var(--bs);height:var(--bs);border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-size:calc(var(--bs)*.46);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);will-change:transform;touch-action:none;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.8) 0 7%,transparent 8%),radial-gradient(circle at 45% 40%,var(--c) 0 55%,var(--cd) 100%);
  box-shadow:0 6px 14px rgba(0,0,0,.4)}
.ball.burst{animation:burst .32s forwards}
.ball.fade{transition:opacity .4s;opacity:0}

/* pairs */
.cards{flex:1;min-height:0;width:100%;max-width:900px;margin-inline:auto;display:grid;gap:clamp(8px,2vw,14px);
  grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(var(--h),1fr)}
@media (min-aspect-ratio:1/1){.cards{grid-template-columns:repeat(var(--h),1fr);grid-template-rows:repeat(2,1fr)}}
.card{width:100%;height:100%;min-height:0;border-radius:20px;background:var(--paper);box-shadow:0 6px 0 var(--paper-sh);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;transition:transform .15s;animation:pop .4s backwards}
.card b{font-family:var(--display);font-weight:400;font-size:clamp(30px,min(10vw,8vh),64px);line-height:1;color:var(--ink)}
.card .dots{--d:clamp(5px,1.5vw,10px);color:var(--ink-soft)}
.card.sel{outline:6px solid var(--blue);transform:translateY(-4px)}
.card.sel2{outline:6px solid var(--red);transform:translateY(-4px)}
.card.shake{animation:shake .45s}

/* house */
.house{gap:10px}
.bld{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;width:min(100%,400px);margin-inline:auto}
.roof{width:100%;height:clamp(54px,11vh,92px);flex:none;background:linear-gradient(var(--red),var(--red-dk));clip-path:polygon(50% 0,100% 100%,0 100%);display:grid;place-items:end center;padding-bottom:6px}
.roof b{font-family:var(--display);font-weight:400;font-size:clamp(26px,5.6vh,46px);color:#fff;line-height:1}
.floors{flex:1;min-height:0;width:86%;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;padding:6px;border-radius:0 0 12px 12px;background:#d9c7a3;box-shadow:inset 0 0 0 4px #b39a6e}
.floor{flex:1 1 0;min-height:0;max-height:70px;display:grid;grid-template-columns:1fr 1fr;gap:6px;border-radius:9px}
.win{display:grid;place-items:center;border-radius:8px;background:#26304f;border:3px solid var(--blue);font-family:var(--display);font-size:clamp(15px,4vh,36px);color:#fff;min-height:0;transition:background .3s}
.win.r{border-color:var(--red)}
.win.q{color:var(--yellow)}
.floor.cur{outline:4px solid var(--yellow);outline-offset:2px}
.floor.cur .win.q{animation:blinkq 1s steps(2) infinite}
.floor.lit .win{background:#ffe27a;color:#3a2a00;box-shadow:0 0 14px rgba(255,226,122,.7)}
.side{display:flex;flex-direction:column;gap:10px;justify-content:center;flex:none}
@media (min-aspect-ratio:5/4){.house{flex-direction:row;align-items:stretch}.house .side{flex:1}.bld{flex:1}.house .answers{display:grid;grid-template-columns:repeat(2,auto);justify-content:center}}

/* reward */
.reward{align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,rgba(255,201,40,.25),transparent 60%)}
.pufik.rp{height:clamp(140px,34vh,300px);width:auto}
.prize{font-size:clamp(56px,14vw,100px);line-height:1;font-family:system-ui;animation:prize 1s cubic-bezier(.3,1.6,.5,1) .3s both;filter:drop-shadow(0 0 18px rgba(255,201,40,.7))}
.rbtns{display:flex;gap:20px}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-24px;left:var(--x);width:10px;height:16px;border-radius:2px;background:var(--c);transform:rotate(var(--r));animation:fall var(--d) linear var(--dl) infinite}

/* grab hand */
.cable{position:absolute;bottom:0;width:12px;height:0;border-radius:6px;transform-origin:50% 100%;
  background:repeating-linear-gradient(0deg,#6b7aa6 0 7px,#3b4670 7px 14px);box-shadow:0 0 0 2px #1b2240}
.cable .hand{position:absolute;left:50%;top:0;width:60px;height:72px;transform:translate(-50%,-78%);transition:transform .12s}
.cable .hand svg{width:100%;height:100%}
.cable.shut .hand{transform:translate(-50%,-78%) scale(.88,.8)}

/* players & turns */
#prog{flex-direction:column;gap:3px;flex-wrap:nowrap}
.prow{display:flex;align-items:center;gap:6px;padding:1px 8px;border-radius:12px;border:2px solid transparent;opacity:.55;transition:opacity .25s,box-shadow .25s,border-color .25s}
.prow.cur,.prow.solo{opacity:1}
.prow.cur{border-color:var(--pc);background:#0b1224;box-shadow:0 0 12px var(--pc)}
.prow .pav{font-size:20px;line-height:1;font-family:system-ui}
.lamps{display:flex;gap:5px;flex-wrap:wrap}
.lamps i{width:14px;height:14px;border-radius:50%;background:#0b1224;border:2px solid var(--line);transition:background .3s,box-shadow .3s,transform .3s}
.lamps i.on{background:var(--pc);border-color:#fff;box-shadow:0 0 8px var(--pc);transform:scale(1.12)}
#stage::after{content:"";position:absolute;inset:2px;border-radius:22px;pointer-events:none;z-index:15;box-shadow:inset 0 0 0 4px var(--pc),inset 0 0 26px var(--pc);opacity:0;transition:opacity .3s}
.duo #stage::after{opacity:.75}
#splash{position:absolute;left:50%;top:40%;z-index:25;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 28px;border-radius:30px;
  background:var(--pc);color:#fff;box-shadow:0 10px 0 rgba(0,0,0,.35),0 0 60px var(--pc);transform:translate(-50%,-50%);opacity:0}
#splash.go{animation:splash 1.35s ease both}
.sav{font-size:clamp(56px,16vw,96px);line-height:1;font-family:system-ui}
.snm{font-family:var(--display);font-size:clamp(24px,7vw,40px);text-shadow:0 3px 0 rgba(0,0,0,.3)}
@keyframes splash{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-50%) scale(1.08);opacity:1}25%{transform:translate(-50%,-50%) scale(1);opacity:1}78%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.85);opacity:0}}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:1000px;margin-inline:auto;flex:none;padding-top:6px}
.pcard{position:relative;display:flex;border-radius:22px;background:var(--panel);border:3px solid var(--line);opacity:.45;filter:grayscale(.8);transition:opacity .2s,filter .2s,box-shadow .2s,border-color .2s}
.pcard.on{opacity:1;filter:none;border-color:var(--pc);box-shadow:0 0 18px var(--pc)}
.pcard.shake{animation:shake .4s}
.ptog{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;min-width:0;text-align:left}
.ptog .pav{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--pc);flex:none;font-size:36px;line-height:1;font-family:system-ui;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25)}
.pinfo{display:flex;flex-direction:column;min-width:0}
.pnm{font-family:var(--display);font-size:clamp(16px,4.6vw,24px)}
.pcount{font-size:13px;color:var(--muted)}
.pchg{position:absolute;top:-10px;right:-10px;width:36px;height:36px;border-radius:50%;background:var(--panel-hi);border:2px solid var(--line);font-size:18px;color:var(--fg);box-shadow:0 3px 0 #0a1020}
.whohelp{max-width:none;text-align:center;font-size:12px;flex:none}
.shelf{border-color:var(--pc,var(--line))}
.prizes{display:flex;gap:clamp(16px,6vw,48px);justify-content:center}
.prz{display:flex;flex-direction:column;align-items:center;gap:4px;animation:prize 1s cubic-bezier(.3,1.6,.5,1) both}
.prz .prize{animation:none}
.prz .pav{font-size:30px;line-height:1;font-family:system-ui;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--pc)}
.prz .pnm{font-size:18px}
.card.gone{visibility:hidden}
.bld{position:relative}
.bav{position:absolute;left:4px;top:0;z-index:2;font-size:clamp(30px,6vh,44px);line-height:1;font-family:system-ui}

/* Russian */

.slogi,.first{align-items:center;justify-content:center}
.sylrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:none}

.rrow{display:flex;justify-content:center;flex:none}

.vsing{font-size:40px;line-height:1;font-family:system-ui}
.vslots{display:flex;gap:10px}

.vslots i.got{border:3px solid #ffb3c0;background:var(--red);animation:pop .4s backwards}
.show{flex:none;display:flex;align-items:center;justify-content:center;gap:16px;min-height:clamp(90px,18vh,150px);background:linear-gradient(var(--panel-hi),var(--panel));border:3px solid var(--line);border-radius:20px;padding:8px 14px}
.sl{font-family:var(--display);font-size:clamp(56px,min(16vw,13vh),110px);line-height:1}
.sl.vow{color:var(--red)}.sl.con{color:var(--blue-lt)}.sl.sign{color:var(--muted)}
.se{font-size:clamp(48px,min(14vw,11vh),96px);line-height:1;font-family:system-ui}
.se .pufik{height:1em;width:auto}
.sw{font-size:clamp(16px,4.5vw,24px);color:var(--muted)}
.abcgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;gap:6px}
@media (min-aspect-ratio:1/1){.abcgrid{grid-template-columns:repeat(11,1fr)}}
.ab{border-radius:12px;background:var(--paper);font-family:var(--display);font-size:clamp(20px,min(6vw,4.4vh),40px);box-shadow:0 4px 0 var(--paper-sh);min-height:0}
.ab.vow{color:var(--red)}.ab.con{color:var(--blue)}.ab.sign{color:#7b84a3}
.ab.seen{outline:3px solid var(--yellow);outline-offset:-3px}
.ab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--paper-sh)}

/* gifts & saved games */
.mrow{display:flex;gap:10px;width:100%;max-width:1000px;margin-inline:auto;flex:none}
.giftbtn,.cont{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:64px;border-radius:20px;font-family:var(--display);font-size:18px;color:#fff}
.giftbtn{background:linear-gradient(#ff5f8f,#d9356a);box-shadow:0 6px 0 #8f1d43}
.cont{background:linear-gradient(#2fbf7a,#169a5c);box-shadow:0 6px 0 #0d6b3e}
.giftbtn:active,.cont:active{transform:translateY(4px);box-shadow:none}
.giftbtn .gi,.cont .ci,.cont .cav{font-size:30px;line-height:1;font-family:system-ui}
.cont .cav{font-size:22px}
.cplay{font-size:22px}
.gcount{position:absolute;right:-6px;top:-8px;font-size:15px;font-family:var(--display);font-weight:400;background:var(--red);color:#fff;border-radius:12px;padding:2px 8px;border:2px solid #fff;line-height:1.2}
.gbox{position:relative;font-size:clamp(64px,18vw,110px);line-height:1;font-family:system-ui;filter:drop-shadow(0 0 16px var(--pc));animation:gwiggle 1.8s ease-in-out infinite}
.gbox.opening{animation:gopen .9s ease-in forwards}
.gbox.empty{animation:none;filter:grayscale(1);opacity:.3}
@keyframes gwiggle{0%,68%,100%{transform:rotate(0)}74%{transform:rotate(-10deg)}80%{transform:rotate(10deg)}86%{transform:rotate(-6deg)}92%{transform:rotate(6deg)}}
@keyframes gopen{0%{transform:scale(1)}20%{transform:scale(1.1) rotate(-12deg)}40%{transform:scale(1.15) rotate(12deg)}60%{transform:scale(1.2) rotate(-12deg)}80%{transform:scale(1.35);opacity:1}100%{transform:scale(2.2);opacity:0}}
.gslot{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.greveal{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;max-width:230px;padding:10px;border-radius:18px;animation:pop .5s backwards}
.greveal.real{background:rgba(255,201,40,.14);border:2px solid var(--yellow);box-shadow:0 0 24px rgba(255,201,40,.35)}
.ge{font-size:clamp(56px,15vw,92px);line-height:1;font-family:system-ui;animation:prize .8s cubic-bezier(.3,1.6,.5,1) both}
.gt{font-family:var(--display);font-size:clamp(16px,4.4vw,22px);color:var(--yellow);line-height:1.15}
.gd{font-size:13px;color:var(--fg);line-height:1.3;font-weight:700}
.grare{font-size:12px;font-family:var(--display);color:#fff;background:var(--pc);padding:3px 10px;border-radius:10px}
.gmore{font-size:20px;padding:8px 14px;border-radius:14px;background:var(--panel-hi);border:2px solid var(--line);font-family:var(--display);color:var(--fg)}
.gempty{font-size:12px;color:var(--muted);text-align:center;font-weight:700}
.reward{justify-content:safe center}
.reward.opened .pufik.rp{height:clamp(80px,15vh,150px)}
.prz{min-width:0;max-width:48%}
.gcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:900px;margin-inline:auto;flex:none}
.gcol{background:var(--panel);border:3px solid var(--pc);border-radius:22px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.ghead{display:flex;align-items:center;gap:8px}
.ghead .pav{width:44px;height:44px;border-radius:50%;background:var(--pc);display:grid;place-items:center;font-size:26px;line-height:1;font-family:system-ui}
.plist{display:flex;flex-direction:column;gap:6px;width:100%}
.pz{display:flex;align-items:center;gap:8px;background:#0c1428;border:2px solid var(--line);border-radius:12px;padding:6px 8px;text-align:left;width:100%}
.pz .pe{font-size:24px;line-height:1;font-family:system-ui}
.pz .pzt{flex:1;font-size:12px;min-width:0;line-height:1.2}
.pz .pzs{font-size:16px}
.pz.given{opacity:.45}
.parent-on .pz{border-color:var(--yellow)}
.parentbtn{align-self:center;font-size:13px;color:var(--muted);padding:12px 18px;border-radius:14px;border:2px dashed var(--line);position:relative;overflow:hidden;flex:none;font-weight:700}
.parentbtn.hold::after{content:"";position:absolute;inset:0;background:rgba(255,201,40,.3);transform-origin:left;animation:hold 1.5s linear forwards}
@keyframes hold{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.parent-area{background:#0c1428;border:2px solid var(--yellow);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;max-width:900px;margin-inline:auto;flex:none;font-size:14px;font-weight:700}
.rates{display:flex;flex-wrap:wrap;gap:6px}
.rates button{padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel)}
.rates button.on{background:var(--yellow);color:#3a2600;border-color:#fff3b0}
.pcheck{display:flex;align-items:center;gap:8px}
.pcheck input{width:22px;height:22px;accent-color:var(--yellow)}
.pcheck small{color:var(--muted);margin-left:auto}
.phelp{font-size:12px;color:var(--muted);line-height:1.4}

/* English */
.subj{grid-template-columns:repeat(3,1fr)}
.sj{flex-direction:column;gap:0;height:66px}
.sj b{font-size:24px;line-height:1.1}
.sj small{font-size:12px}
.cattabs{display:flex;gap:8px;justify-content:center;flex:none}

@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="fur" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="app">
  <header id="bar" hidden>
    <button class="ib" id="bHome" aria-label="Меню"></button>
    <div id="prog" aria-hidden="true"></div>
    <button class="ib" id="bMute" aria-label="Звук"></button>
    <button class="ib" id="bEar" aria-label="Повторить"></button>
  </header>
  <main id="stage"><div id="view"></div><div id="grab"></div><div id="splash" hidden></div></main>
  <button id="sub" hidden aria-label="Повторить"><span id="subFace"></span><span id="subt"></span></button>
</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const app=$('#app'), bar=$('#bar'), view=$('#view'), grabL=$('#grab'), sub=$('#sub'), subT=$('#subt'), prog=$('#prog'), splash=$('#splash');
const bHome=$('#bHome'), bEar=$('#bEar'), bMute=$('#bMute');
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
const store={
  get(k,d){try{const v=localStorage.getItem('fabrika_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('fabrika_'+k,JSON.stringify(v))}catch(e){}}
};
let stats=store.get('stats',{}), muted=store.get('muted',false);
if(typeof stats!=='object'||!stats) stats={};
function record(n,ok){const s=stats[n]||(stats[n]={r:0,w:0});ok?s.r++:s.w++;store.set('stats',stats)}

/* ---------- players ---------- */
const NAMES=['Асман','Азамат'];
const PCOL=['#ff9a2e','#a06bff'];
const ANIMALS=['🦁','🐻','🐯','🐼','🦊','🐸','🐵','🐶','🐱','🦖','🐲','🦈','🦅','🐺'];
let pIcons=store.get('icons',['🦁','🐻']);
if(!Array.isArray(pIcons)||pIcons.length!==2) pIcons=['🦁','🐻'];
let active=store.get('active',[true,true]);
if(!Array.isArray(active)||active.length!==2||(!active[0]&&!active[1])) active=[true,true];
let toysBy=store.get('toys2',null);
if(!toysBy||!Array.isArray(toysBy[0])||!Array.isArray(toysBy[1])) toysBy={0:[],1:[]};
const activePlayers=()=>[0,1].filter(i=>active[i]);
let starter=0;

const TOYS=['🧸','🚗','🎈','🪀','🤖','🦖','🐙','🚀','⚽','🎁','🦆','🍭','🐞','🧩','🐻','🦄','🍩','🐸','🐣','🍓'];
const PAL=['#2f7bff','#ff3d5a','#e8459a','#17a866','#8f5bff','#f07a12'];
const BALLC=[['#2f7bff','#163e9c'],['#ff3d5a','#a3122b'],['#f2a10f','#a86400'],['#ff4fa0','#a8185f'],['#22c07a','#0f7447'],['#8f5bff','#4e25b3']];
const PRAISE=['Молодец','Супер','Правильно','Ура','Отлично','Здорово','Класс','Точно'];

/* ---------- number words ---------- */
const W0=['ноль','один','два','три','четыре','пять','шесть','семь','восемь','девять','десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'];
function w(n){if(n<20)return W0[n];const t=['','','двадцать','тридцать','сорок'][Math.floor(n/10)];return n%10?t+' '+W0[n%10]:t}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function units(k){if(k===1)return 'одна единица';if(k===2)return 'две единицы';if(k<=4)return w(k)+' единицы';return w(k)+' единиц'}
function comp(N,a,b){
  let t=`${cap(w(N))} — это ${w(a)} и ${w(b)}.`;
  if(N>10&&N<20&&(a===10||b===10)) t+=` Один десяток и ${units(N-10)}.`;
  if(N===20&&a===10) t+=' Два десятка.';
  return t;
}
function wrongTxt(x,y,N){const s=x+y;return `${cap(w(x))} и ${w(y)} — это ${w(s)}. ${s>N?'Много':'Мало'}! Нужно ${w(N)}.`}

let gen=0, loopId=0;
const timers=new Set();
function later(fn,ms){const g=gen;const id=setTimeout(()=>{timers.delete(id);if(g===gen)fn()},ms);timers.add(id);return id}
const wait=ms=>new Promise(r=>later(r,ms));

  gen++;curScreen='';timers.forEach(clearTimeout);timers.clear();

/* ---------- voice ---------- */
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
let voice=null, voiceEn=null, lastQ='', lastSay='', curU=null, sayTok=0;
function pickVoice(){
  if(!synth)return;
  const all=synth.getVoices(),vs=all.filter(v=>/^ru/i.test(v.lang)||/russian|русск/i.test(v.name));
  voice=vs.find(v=>/google/i.test(v.name))||vs.find(v=>/milena|katya|alena|irina|svetlana|dariya|anna/i.test(v.name))||vs[0]||null;
  const en=all.filter(v=>/^en/i.test(v.lang));
  voiceEn=en.find(v=>/google us/i.test(v.name))||en.find(v=>/^en.US/i.test(v.lang)&&/samantha|google|aria|jenny|allison/i.test(v.name))||en.find(v=>/^en.(US|GB)/i.test(v.lang))||en[0]||null;
}
if(synth){pickVoice();try{synth.addEventListener('voiceschanged',pickVoice)}catch(e){synth.onvoiceschanged=pickVoice}}
function setTalking(on){app.classList.toggle('talking',!!on)}
/* say("текст") speaks Russian; say([["Cat!","en"],["— кошка.","ru"]]) speaks the parts in turn with matching voices */
function say(x){
  const tok=++sayTok;lastSay=x;
  if(!Array.isArray(x))return speak(x,'ru',true);
  subT.textContent=x.map(p=>p[0]).join(' ');
  return (async()=>{for(const [t,l] of x){if(tok!==sayTok)return;await speak(t,l||'ru',false)}})();
}
function speak(text,lang,sub){
  if(sub)subT.textContent=text;
  const g0=gen,en=lang==='en';
  return new Promise(res=>{
    let done=false;
    const fin=()=>{if(done)return;done=true;setTalking(false);if(g0===gen)res()};
    if(!synth||muted){setTimeout(fin,600+text.length*45);return}
    const u=new SpeechSynthesisUtterance(text);
    u.lang=en?'en-US':'ru-RU';const vv=en?voiceEn:voice;if(vv)u.voice=vv;u.rate=en?.82:.93;u.pitch=en?1.05:1.12;
    u.onstart=()=>{if(!done)setTalking(true)};u.onend=fin;u.onerror=fin;
    curU=u;
    setTimeout(fin,3000+text.length*110);
    const go=()=>{if(done)return;try{synth.resume();synth.speak(u)}catch(e){fin()}};
    if(synth.speaking||synth.pending){try{synth.cancel()}catch(e){}setTimeout(go,60)}else go();
  });
}
function ask(text){lastQ=text;return say(text)}

/* ---------- sounds ---------- */
let ac=null;
function actx(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}
  if(ac&&ac.state==='suspended'){try{ac.resume()}catch(e){}}
  return ac;
}
function tone(f,d,type,v,t0,f2){
  const a=actx();if(!a||muted)return;
  const t=a.currentTime+(t0||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.15,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);
}
const sfx={
  tap:()=>tone(520,.07,'triangle',.12),
  pop:()=>tone(620,.1,'triangle',.16,0,1150),
  good:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.15,i*.08)),
  bad:()=>tone(240,.3,'square',.05,0,150),
  whoosh:()=>tone(160,.26,'sawtooth',.045,0,880),
  turn:()=>{tone(392,.12,'triangle',.13);tone(587,.18,'triangle',.13,.1)},
  win:()=>[523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,.26,'triangle',.15,i*.11)),
};

const eqHTML=(N,ia,ib,a,b)=>`<div class="eq"><b class="nbig">${N}</b><span class="op">=</span><b class="nb blue" id="${ia}">${a}</b><span class="op">+</span><b class="nb red" id="${ib}">${b}</b></div>`;

function options(c,N){
  const cnt=N<=4?3:4,max=Math.max(N-1,cnt),s=new Set([c]);
  for(let t=0;t<60&&s.size<cnt;t++){const v=c+(Math.random()<.5?-1:1)*rnd(1,3);if(v>=1&&v<=max)s.add(v)}
  for(let v=1;s.size<cnt;v++)s.add(v);
  return shuffle([...s]);
}
function distract(c,N){const max=Math.max(N-1,3);for(let t=0;t<30;t++){const v=c+(Math.random()<.5?-1:1)*rnd(1,3);if(v>=1&&v<=max&&v!==c)return v}return c===1?2:c-1}

/* the grabbing hand: shoots a cable from the bottom, grabs the element, pulls it down */
function grab(target,color){
  return new Promise(res=>{
    const L=grabL.getBoundingClientRect(),r=target.getBoundingClientRect();
    const ghost=target.cloneNode(true);ghost.removeAttribute('id');
    Object.assign(ghost.style,{position:'absolute',left:(r.left-L.left)+'px',top:(r.top-L.top)+'px',width:r.width+'px',height:r.height+'px',margin:'0',transform:'none',animation:'none'});
    grabL.appendChild(ghost);target.style.visibility='hidden';
    const tx=r.left-L.left+r.width/2,ty=r.top-L.top+r.height/2,ox=L.width*(color==='blue'?.28:.72),oy=L.height+10;
    if(RM){ghost.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'}).onfinish=()=>{ghost.remove();res()};return}
    const dx=tx-ox,dy=oy-ty,d=Math.max(0,Math.hypot(dx,dy)-20),ang=Math.atan2(dx,dy)*180/Math.PI;
    const cab=document.createElement('div');cab.className='cable';
    cab.style.left=ox+'px';cab.style.transform=`translateX(-50%) rotate(${ang}deg)`;
    cab.innerHTML=`<div class="hand">${glove(color)}</div>`;
    grabL.appendChild(cab);sfx.whoosh();
    const out=cab.animate([{height:'0px'},{height:d+'px'}],{duration:280,easing:'cubic-bezier(.2,.9,.3,1)',fill:'forwards'});
    out.onfinish=()=>{
      cab.classList.add('shut');sfx.tap();
      const opt={duration:400,delay:150,easing:'cubic-bezier(.6,0,.8,.4)',fill:'forwards'};
      const back=cab.animate([{height:d+'px'},{height:'0px'}],opt);
      ghost.animate([{transform:'none',opacity:1},{transform:`translate(${ox-tx}px,${oy-ty}px) scale(.35)`,opacity:.3}],opt);
      back.onfinish=()=>{cab.remove();ghost.remove();res()};
    };
  });
}

/* ---------- session: players, turns, task decks ---------- */
let S={ps:[],prog:{},turn:0,lastN:0,intro:{},shared:false,done:0,total:0};
const curP=()=>S.ps[S.turn];
const pname=()=>NAMES[curP()];
const isDuo=()=>S.ps.length>1;
function nextTurn(){if(isDuo())S.turn=(S.turn+1)%S.ps.length}
const allDone=()=>S.ps.every(p=>S.prog[p].done>=S.prog[p].total);
/* after a finished task: reward, or hand the turn to the next child who still has tasks */
function advance(fn){
  if(allDone())return reward();
  if(isDuo()){do{nextTurn()}while(S.prog[curP()].done>=S.prog[curP()].total)}
  fn();
}
function firstFor(){const p=curP(),f=!S.intro[p];S.intro[p]=true;return f}
function call(first){
  const n=pname();
  if(isDuo())return pick([`${n}, твоя очередь!`,`${n}, теперь ты!`,`${n}, давай!`])+' ';
  return first?`${n}, поехали! `:'';
}
const praise=()=>`${pick(PRAISE)}, ${pname()}!`;
const both=()=>S.ps.map(p=>NAMES[p]).join(' и ');

function adaptive(max){
  const pool=[];let tot=0;
  for(let n=2;n<=max;n++){
    if(n===S.lastN)continue;
    const s=stats[n]||{r:0,w:0};
    let wt=n<=10?4:1.3;
    if(n<=3)wt*=.5;
    wt*=1+Math.min(3,s.w/(s.r+1));
    if(s.r>=10&&s.w/(s.r+s.w)<.1)wt*=.6;
    pool.push([n,wt]);tot+=wt;
  }
  let x=Math.random()*tot;
  for(const [n,wt] of pool){if((x-=wt)<=0)return n}
  return pool[pool.length-1][0];
}
function nextN(){const n=typeof S.mode==='number'?S.mode:adaptive(S.mode==='mix10'?10:20);S.lastN=n;return n}
/* every way to split N (for 11–20: six of them, always including 10 + units) */
function splitsFor(N){
  if(N<=10)return range(1,N-1);
  const s=new Set([10,N-10]);
  while(s.size<Math.min(6,N-1))s.add(rnd(1,N-1));
  return [...s].sort((x,y)=>x-y);
}
/* one deck of tasks, dealt to every child in its own shuffled order */
function dealTasks(){
  let base;
  if(typeof S.mode==='number'){
    const N=S.mode;let as=splitsFor(N);
    while(as.length<3)as=as.concat(as);
    base=as.map(a=>({N,a}));
  }else{
    base=[];
    for(let i=0;i<5;i++){const N=nextN();base.push({N,a:(N>10&&Math.random()<.5)?pick([10,N-10]):rnd(1,N-1)})}
  }
  S.queue={};
  S.ps.forEach(p=>{S.queue[p]=shuffle(base.map(t=>({N:t.N,a:t.a})));S.prog[p]={done:0,total:base.length}});
}
const takeTask=()=>S.queue[curP()][S.prog[curP()].done];

const lamps=(d,t)=>range(1,t).map(i=>`<i class="${i<=d?'on':''}"></i>`).join('');

}

      <div class="tray blue">${glove('blue')}<div class="bin" id="tA"></div></div>

    </div>

    }

/* ---------- game 3: catch the missing ball ---------- */
function gameCatch(){dealTasks();catchTask()}
function catchTask(){
  newScreen();showTurn(true);
  const first=firstFor(),t=takeTask(),N=t.N,a=t.a,b=N-a;
  view.innerHTML=`<div class="screen catch">
    <div class="machine">${eqHTML(N,'ca','cb',a,'?')}<div id="cslots">${slots(N,a,0)}</div></div>
    <div class="field" id="field"><div class="pipes" id="pipes"></div></div>
  </div>`;
  const field=$('#field'),FW=field.clientWidth,FH=field.clientHeight;
  const lanes=FW<420?3:FW<760?4:5,laneW=FW/lanes,bs=Math.max(54,Math.min(110,laneW*.8,FH*.28));
  field.style.setProperty('--bs',bs+'px');
  $('#pipes').innerHTML=range(0,lanes-1).map(i=>`<i style="left:${(i+.5)*laneW}px"></i>`).join('');
  const speed=FH/(first?8:6.5);
  let balls=[],since=0,locked=false,wrongRec=false;
  function make(v,lane){
    const el=document.createElement('button');el.className='ball';el.textContent=v;el.setAttribute('aria-label',v);
    const c=pick(BALLC);el.style.setProperty('--c',c[0]);el.style.setProperty('--cd',c[1]);
    const o={v,lane,el,x:(lane+.5)*laneW-bs/2,y:-bs,stop:false,gone:false};
    el.style.transform=`translate3d(${o.x}px,${o.y}px,0)`;
    el.addEventListener('pointerdown',e=>{e.preventDefault();hit(o)});
    field.appendChild(el);balls.push(o);
  }
  function spawn(){
    if(locked)return;
    const live=balls.filter(o=>!o.gone&&!o.stop);
    if(live.length<=lanes){
      const free=range(0,lanes-1).filter(l=>!live.some(o=>o.lane===l&&o.y<bs*1.4));
      if(free.length){
        let v;
        if(!live.some(o=>o.v===b)&&(since>=2||Math.random()<.45)){v=b;since=0}else{v=distract(b,N);since++}
        make(v,pick(free));
      }
    }
    later(spawn,1250);
  }
  let last=performance.now();
  function frame(t){
    const dt=Math.min(.05,(t-last)/1000);last=t;
    for(const o of balls){
      if(o.stop||o.gone)continue;
      o.y+=speed*dt;o.el.style.transform=`translate3d(${o.x}px,${o.y}px,0)`;
      if(o.y>FH+4){o.gone=true;o.el.remove()}
    }
    balls=balls.filter(o=>!o.gone);
    loopId=requestAnimationFrame(frame);
  }
  loopId=requestAnimationFrame(frame);
  async function hit(o){
    if(locked||o.stop||o.gone)return;
    if(o.v===b){
      locked=true;o.stop=true;record(N,true);sfx.good();grab(o.el,'red');
      setNum('cb',b);$('#cslots').innerHTML=slots(N,a,b);
      balls.forEach(x=>{if(x!==o&&!x.gone){x.stop=true;x.el.classList.add('fade')}});
      S.prog[curP()].done++;setProgress();
      await say(`${praise()} ${comp(N,a,b)}`);
      await wait(350);
      advance(catchTask);
    }else{
      o.stop=true;o.el.style.setProperty('--t',o.el.style.transform);o.el.classList.add('burst');
      later(()=>{o.gone=true;o.el.remove()},360);
      sfx.bad();if(!wrongRec){record(N,false);wrongRec=true}
      say(wrongTxt(a,o.v,N));
    }
  }
  ask(call(first)+(first?`Нужно ${w(N)}. Есть ${w(a)}. Сколько не хватает? Посчитай пустые кружочки и поймай такой шарик!`:`Нужно ${w(N)}. Есть ${w(a)}. Сколько не хватает?`));
  later(spawn,isDuo()?1100:700);
}

/* ---------- game 4: pairs (each child gets an own board with the same pairs) ---------- */
function gamePairs(){
  const mk=N=>{
    let c=range(1,Math.floor(N/2)).map(a=>[a,N-a]);
    if(N>10){shuffle(c);c.sort((p,q)=>(q.includes(10)?1:0)-(p.includes(10)?1:0));c=c.slice(0,4)}
    while(c.length<3)c=c.concat([c[0]]);
    return c;
  };
  const Ns=[];for(let r=0;r<(isDuo()?1:2);r++)Ns.push(nextN());
  const cands=Ns.map(mk);
  S.boards={};
  S.ps.forEach(p=>{
    S.boards[p]=Ns.map((N,r)=>({N,vals:shuffle(cands[r].flatMap(q=>Math.random()<.5?[q[0],q[1]]:[q[1],q[0]])),gone:[]}));
    S.prog[p]={done:0,total:cands.reduce((s,c)=>s+c.length,0)};
  });
  pairsTurn();
}
function pairsTurn(){
  newScreen();showTurn(true);
  const first=firstFor(),p=curP(),bd=S.boards[p].find(x=>x.gone.length<x.vals.length),N=bd.N;
  view.innerHTML=`<div class="screen pairs">${eqHTML(N,'pa','pb','?','?')}
    <div class="cards" style="--h:${bd.vals.length/2}">${bd.vals.map((v,i)=>`<button class="card${bd.gone.includes(i)?' gone':''}" data-i="${i}" data-v="${v}" style="animation-delay:${i*.04}s" aria-label="${v}"><b>${v}</b>${dots(v)}</button>`).join('')}</div></div>`;
  let sel=null,busy=false;
  view.querySelectorAll('.card').forEach(card=>card.addEventListener('click',async()=>{
    if(busy||card.classList.contains('gone'))return;
    const v=+card.dataset.v;
    if(!sel){sfx.tap();sel=card;card.classList.add('sel');setNum('pa',v);setNum('pb','?');say(cap(w(v))+'. И сколько?');return}
    if(card===sel){sel.classList.remove('sel');sel=null;setNum('pa','?');return}
    const x=+sel.dataset.v,c1=sel;
    if(x+v===N){
      busy=true;record(N,true);sfx.good();card.classList.add('sel2');setNum('pb',v);
      c1.classList.add('gone');card.classList.add('gone');bd.gone.push(+c1.dataset.i,+card.dataset.i);
      grab(c1,'blue');grab(card,'red');
      S.prog[p].done++;setProgress();sel=null;
      await say(`${praise()} ${comp(N,x,v)}`);
      if(allDone()){await wait(250);reward()}
      else if(isDuo())advance(pairsTurn);
      else if(bd.gone.length>=bd.vals.length){await wait(250);pairsTurn()}
      else{busy=false;setNum('pa','?');setNum('pb','?')}
    }else{
      record(N,false);sfx.bad();busy=true;
      card.classList.add('sel2','shake');c1.classList.add('shake');setNum('pb',v);
      say(wrongTxt(x,v,N));
      later(()=>{card.classList.remove('sel2','shake');c1.classList.remove('sel','shake');setNum('pa','?');setNum('pb','?');sel=null;busy=false},900);
    }
  }));
  ask(call(first)+(first?`Нужно ${w(N)}. Нажми на две карточки, которые вместе дают ${w(N)}.`:`Найди пару для числа ${w(N)}!`));
}

/* ---------- game 5: number house (two children: each builds an own house, floors in shuffled order) ---------- */
function gameHouse(){
  const N=nextN();
  const rows=splitsFor(N);
  S.house={N};
  S.ps.forEach(p=>{
    S.house[p]={fl:rows.map(a=>({a,b:N-a,h:Math.random()<.5?'l':'r',ok:false})),order:isDuo()?shuffle(range(0,rows.length-1)):range(0,rows.length-1)};
    S.prog[p]={done:0,total:rows.length};
  });
  houseTurn();
}
function houseTurn(){
  newScreen();showTurn(true);
  const first=firstFor(),p=curP(),N=S.house.N,H=S.house[p],fl=H.fl,i=H.order[S.prog[p].done],f=fl[i];
  const win=(g,side)=>{const hid=!g.ok&&g.h===side;return `<span class="win ${side}${hid?' q':''}">${hid?'?':side==='l'?g.a:g.b}</span>`};
  view.innerHTML=`<div class="screen house">
    <div class="bld">${isDuo()?`<span class="bav">${pIcons[p]}</span>`:''}<div class="roof"${isDuo()?` style="background:${PCOL[p]}"`:''}><b>${N}</b></div>
      <div class="floors">${fl.map((g,k)=>`<div class="floor${g.ok?' lit':''}${k===i?' cur':''}" id="f${k}">${win(g,'l')}${win(g,'r')}</div>`).reverse().join('')}</div></div>
    <div class="side"><div class="hint" id="hint"></div><div class="answers" id="ans"></div></div>
  </div>`;
  const fe=$('#f'+i),known=f.h==='l'?f.b:f.a,ans=f.h==='l'?f.a:f.b;let tries=0;
  const q=f.h==='r'?`${cap(w(N))} — это ${w(f.a)} и сколько?`:`${cap(w(N))} — это сколько и ${w(f.b)}?`;
  const intro=first?`Это ${isDuo()?'твой ':''}домик числа ${w(N)}. На каждом этаже живут два числа, вместе они дают ${w(N)}. `:'';
  ask(call(first)+intro+q);
  renderAnswers($('#ans'),options(ans,N),async(v,btn,all)=>{
    if(v===ans){
      all.forEach(x=>x.classList.add('locked'));btn.classList.remove('pulse');btn.classList.add('right');record(N,true);sfx.good();
      const qe=fe.querySelector('.q');qe.textContent=ans;qe.classList.remove('q');fe.classList.remove('cur');fe.classList.add('lit');f.ok=true;
      $('#hint').innerHTML=slots(N,f.a,f.b);
      S.prog[p].done++;setProgress();
      await say(`${praise()} ${comp(N,f.a,f.b)}`);
      if(S.prog[p].done>=S.prog[p].total)await say(isDuo()?`${pname()}, твой домик готов! Во всех окошках горит свет!`:'Домик готов! Во всех окошках горит свет!');

/* Азбука: tap letters, hear the letter and a word; children alternate taps */
function gameAbc(){
  newScreen();
  S.shared=true;S.total=10;S.done=0;showTurn(false);
  view.innerHTML=`<div class="screen abc">
    <div class="show" id="show"><span class="sl sign" id="sL">?</span><span class="se" id="sE">${pufik('','38 2 124 134')}</span><span class="sw" id="sW"></span></div>

  </div>`;
  const seen=new Set();let finished=false;
  view.querySelectorAll('.ab').forEach(b=>b.addEventListener('click',()=>{
    if(finished)return;
    const L=b.dataset.l,[,word,emo]=ABC.find(x=>x[0]===L);
    sfx.pop();b.classList.add('seen');
    const sL=$('#sL');sL.textContent=L;sL.className='sl '+lcls(L);sL.classList.add('bump');
    $('#sE').innerHTML=emo||'';$('#sW').textContent=word;
    let txt;

    else if(L==='Й')txt='Буква и краткое — согласная. Она живёт в слове чай.';
    else if(L==='Ы')txt='Ы — гласная. Слов на ы не бывает, но она есть в слове сыр.';

function slogiDeck(){const by=n=>shuffle(WORDS.filter(x=>sylls(x[0]).length===n));const g={1:by(1),2:by(2),3:by(3),4:by(4)};return [1,2,2,3,3,4].map(n=>g[n].pop())}

/* Гласные: catch the falling vowels, they can be sung */
function vowelTask(){
  newScreen();showTurn(true);
  const first=firstFor(),need=3;let got=0;
  view.innerHTML=`<div class="screen catch">
    <div class="machine"><span class="vsing">🎤</span><div class="vslots" id="vs">${'<i></i>'.repeat(need)}</div></div>
    <div class="field" id="field"><div class="pipes" id="pipes"></div></div>
  </div>`;
  const field=$('#field'),FW=field.clientWidth,FH=field.clientHeight;
  const lanes=FW<420?3:FW<760?4:5,laneW=FW/lanes,bs=Math.max(54,Math.min(110,laneW*.8,FH*.28));
  field.style.setProperty('--bs',bs+'px');
  $('#pipes').innerHTML=range(0,lanes-1).map(i=>`<i style="left:${(i+.5)*laneW}px"></i>`).join('');
  const speed=FH/(first?8:6.5);
  let balls=[],since=0,locked=false;
  function make(L,lane){
    const el=document.createElement('button');el.className='ball';el.textContent=L;el.setAttribute('aria-label',nm(L));
    const c=pick(BALLC);el.style.setProperty('--c',c[0]);el.style.setProperty('--cd',c[1]);
    const o={L,lane,el,x:(lane+.5)*laneW-bs/2,y:-bs,stop:false,gone:false};
    el.style.transform=`translate3d(${o.x}px,${o.y}px,0)`;
    el.addEventListener('pointerdown',e=>{e.preventDefault();hit(o)});
    field.appendChild(el);balls.push(o);
  }
  function spawn(){
    if(locked)return;
    const live=balls.filter(o=>!o.gone&&!o.stop);
    if(live.length<=lanes){
      const free=range(0,lanes-1).filter(l=>!live.some(o=>o.lane===l&&o.y<bs*1.4));
      if(free.length){
        let L;
        if(since>=2||Math.random()<.45){L=Math.random()<.8?pick(FIND_VOW):pick([...'ЕЁЮЯ']);since=0}else{L=pick(FIND_CON);since++}
        make(L,pick(free));
      }
    }
    later(spawn,1250);
  }
  let last=performance.now();
  function frame(t){
    const dt=Math.min(.05,(t-last)/1000);last=t;
    for(const o of balls){
      if(o.stop||o.gone)continue;
      o.y+=speed*dt;o.el.style.transform=`translate3d(${o.x}px,${o.y}px,0)`;
      if(o.y>FH+4){o.gone=true;o.el.remove()}
    }
    balls=balls.filter(o=>!o.gone);
    loopId=requestAnimationFrame(frame);
  }
  loopId=requestAnimationFrame(frame);
  async function hit(o){
    if(locked||o.stop||o.gone)return;
    const l=o.L.toLowerCase();
    if(isVow(o.L)){
      o.stop=true;grab(o.el,'red');tone(784,.15,'triangle',.14);
      const slot=$('#vs').children[got];slot.textContent=o.L;slot.classList.add('got');got++;
      if(got>=need){
        locked=true;balls.forEach(x=>{if(x!==o&&!x.gone){x.stop=true;x.el.classList.add('fade')}});
        sfx.good();S.prog[curP()].done++;setProgress();
        await say(`${l}-${l}-${l}! ${praise()} Три гласные пойманы!`);
        await wait(300);
        advance(vowelTask);
      }else say(`${l}-${l}-${l}!`);
    }else{
      o.stop=true;o.el.style.setProperty('--t',o.el.style.transform);o.el.classList.add('burst');
      later(()=>{o.gone=true;o.el.remove()},360);
      sfx.bad();say(`${cap(nm(o.L))} — согласная. Лови гласные — их можно петь!`);
    }
  }
  ask(call(first)+(first?'Гласные звуки можно петь: а-а-а, о-о-о, у-у-у. Лови шарики с гласными буквами!':'Лови гласные!'));
  later(spawn,isDuo()?1100:700);
}

}

function listenTask(){
  newScreen();showTurn(true);
  const first=firstFor(),[ci,ii]=takeTask(),C=EN_CATS[ci],T=C.items[ii];
  const opts=shuffle([ii,...shuffle(C.items.map((x,i)=>i).filter(i=>i!==ii)).slice(0,3)]);

      if(tries>=2)lockPulse(all,ii);

}

/* Цвета: catch the balloons of the colour named in English */
function colorDeck(){return shuffle(range(0,6)).slice(0,3)}
function colorTask(){
  newScreen();showTurn(true);
  const first=firstFor(),ti=takeTask(),T=EN_COLORS[ti],need=3;let got=0;
  view.innerHTML=`<div class="screen catch">
    <div class="machine"><button class="btn watch" id="rep" aria-label="Повторить">👂</button><div class="vslots" id="vs">${'<i></i>'.repeat(need)}</div></div>
    <div class="field" id="field"><div class="pipes" id="pipes"></div></div>
  </div>`;
  $('#rep').addEventListener('click',()=>{sfx.tap();say([['Лови','ru'],[T[0]+'!','en']])});
  const field=$('#field'),FW=field.clientWidth,FH=field.clientHeight;
  const lanes=FW<420?3:FW<760?4:5,laneW=FW/lanes,bs=Math.max(54,Math.min(110,laneW*.8,FH*.28));
  field.style.setProperty('--bs',bs+'px');
  $('#pipes').innerHTML=range(0,lanes-1).map(i=>`<i style="left:${(i+.5)*laneW}px"></i>`).join('');
  const speed=FH/(first?8:6.5);
  let balls=[],since=0,locked=false;
  function make(ci,lane){
    const C=EN_COLORS[ci],el=document.createElement('button');el.className='ball';el.setAttribute('aria-label',C[0]);
    el.style.setProperty('--c',C[2]);el.style.setProperty('--cd',C[2]);
    const o={ci,lane,el,x:(lane+.5)*laneW-bs/2,y:-bs,stop:false,gone:false};
    el.style.transform=`translate3d(${o.x}px,${o.y}px,0)`;
    el.addEventListener('pointerdown',e=>{e.preventDefault();hit(o)});
    field.appendChild(el);balls.push(o);
  }
  function spawn(){
    if(locked)return;
    const live=balls.filter(o=>!o.gone&&!o.stop);
    if(live.length<=lanes){
      const free=range(0,lanes-1).filter(l=>!live.some(o=>o.lane===l&&o.y<bs*1.4));
      if(free.length){
        let ci;
        if(since>=2||Math.random()<.45){ci=ti;since=0}else{ci=pick(range(0,6).filter(i=>i!==ti));since++}
        make(ci,pick(free));
      }
    }
    later(spawn,1250);
  }
  let last=performance.now();
  function frame(t){
    const dt=Math.min(.05,(t-last)/1000);last=t;
    for(const o of balls){
      if(o.stop||o.gone)continue;
      o.y+=speed*dt;o.el.style.transform=`translate3d(${o.x}px,${o.y}px,0)`;
      if(o.y>FH+4){o.gone=true;o.el.remove()}
    }
    balls=balls.filter(o=>!o.gone);
    loopId=requestAnimationFrame(frame);
  }
  loopId=requestAnimationFrame(frame);
  async function hit(o){
    if(locked||o.stop||o.gone)return;
    if(o.ci===ti){
      o.stop=true;grab(o.el,'red');tone(784,.15,'triangle',.14);
      const slot=$('#vs').children[got];slot.style.background=T[2];slot.classList.add('got','cslot');got++;
      if(got>=need){
        locked=true;balls.forEach(x=>{if(x!==o&&!x.gone){x.stop=true;x.el.classList.add('fade')}});
        sfx.good();S.prog[curP()].done++;setProgress();
        await say([[praise(),'ru'],[T[0],'en'],[`— это ${T[1]}!`,'ru']]);
        await wait(300);
        advance(colorTask);
      }else say([[T[0]+'!','en']]);
    }else{
      o.stop=true;o.el.style.setProperty('--t',o.el.style.transform);o.el.classList.add('burst');
      later(()=>{o.gone=true;o.el.remove()},360);
      const C=EN_COLORS[o.ci];
      sfx.bad();say([['Это','ru'],[C[0],'en'],[`— ${C[1]}. Лови`,'ru'],[T[0]+'!','en']]);
    }
  }
  ask([[call(first)+(first?'Слушай английское слово и лови шарики такого цвета! Лови':'Лови'),'ru'],[T[0]+'!','en']]);
  later(spawn,isDuo()?1100:700);
}

let prizeCfg=store.get('prizecfg',null);
if(!prizeCfg||typeof prizeCfg.rate!=='number'||!prizeCfg.on)prizeCfg={rate:.5,on:{}};
const saveGifts=()=>store.set('gifts',gifts);
const prizeById=id=>PRIZES.find(z=>z.id===id);
function wpick(list){let x=Math.random()*list.reduce((s,z)=>s+z.w,0);for(const z of list){if((x-=z.w)<=0)return z}return list[list.length-1]}
function rollGift(p){
  const g=gifts[p];g.pending=Math.max(0,g.pending-1);
  const pool=PRIZES.filter(z=>prizeCfg.on[z.id]!==false);
  let r;
  if(pool.length&&Math.random()<prizeCfg.rate){
    const z=wpick(pool);g.prizes.push({id:z.id,given:false});
    r={real:true,e:z.e,t:z.t,d:z.d,rare:z.w<=.5?'Супер-редкий приз!':z.w<=2?'Редкий приз!':''};
  }else{
    const t=pick(GIFT_TOYS);toysBy[p].push(t.e);if(toysBy[p].length>200)toysBy[p]=toysBy[p].slice(-200);store.set('toys2',toysBy);
    r={real:false,e:t.e,t:t.t,d:t.d,rare:''};
  }
  saveGifts();return r;
}

}
/* turns a slot with a box into an opened gift; onOpen runs after the reveal */
function bindSlot(slot,p,onOpen){
  const b=slot.querySelector('.gbox:not(.empty),.gmore');
  if(b)b.addEventListener('click',()=>openGift(slot,p,onOpen));
}
function openGift(slot,p,onOpen){
  if(gifts[p].pending<=0||slot.dataset.busy)return;
  slot.dataset.busy='1';
  if(!slot.querySelector('.gbox')){slot.innerHTML=boxHTML(p)}
  const box=slot.querySelector('.gbox');box.classList.add('opening');
  [392,494,587,698].forEach((f,i)=>tone(f,.12,'triangle',.12,i*.18));
  later(()=>{
    const r=rollGift(p);
    const conf=Array.from({length:14},(_,i)=>`<i style="--x:${rnd(5,95)}%;--d:${(Math.random()+1.2).toFixed(2)}s;--dl:${(Math.random()*.3).toFixed(2)}s;--c:${PAL[i%PAL.length]};--r:${rnd(0,360)}deg"></i>`).join('');
    const more=gifts[p].pending;
    slot.innerHTML=`<div class="greveal${r.real?' real':''}"><div class="confetti">${conf}</div><span class="ge">${r.e}</span>${r.rare?`<span class="grare">★ ${r.rare}</span>`:''}<span class="gt">${r.t}</span><span class="gd">${r.d}</span></div>
      ${more?`<button class="gmore" aria-label="Открыть ещё">🎁 ×${more}</button>`:''}`;
    slot.dataset.busy='';
    r.real?sfx.win():sfx.good();
    bindSlot(slot,p,onOpen);
    say(`${NAMES[p]}, ${r.real?(r.rare?r.rare.toLowerCase()+' ':'настоящий приз! '):'это '}${r.t}! ${r.d}`);
    if(onOpen)onOpen(p,r);
  },900);
}
function prizeListHTML(p){
  const list=gifts[p].prizes.map((z,i)=>[z,i]).reverse().slice(0,20);
  if(!list.length)return '<span class="gempty">Настоящих призов пока нет</span>';

}

    <div class="parent-area" id="parea" hidden>
      <b>Как часто в подарке настоящий приз</b>
      <div class="rates">${RATES.map(([v,l])=>`<button data-r="${v}" class="${prizeCfg.rate===v?'on':''}">${l}</button>`).join('')}</div>
      <b>Какие призы могут выпасть</b>
      ${PRIZES.map(z=>`<label class="pcheck"><input type="checkbox" id="pz_${z.id}" data-z="${z.id}"${prizeCfg.on[z.id]!==false?' checked':''}> <span>${z.e} ${z.t}</span><small>${z.w<=.5?'супер-редкий':z.w<=2?'редкий':'обычный'}</small></label>`).join('')}
      <span class="phelp">Когда выдали приз, нажмите на него в списке ребёнка: ⏳ сменится на ✓. Игрушки без приза уходят на полку в меню.</span>
    </div>
  </div>`;
  const refresh=p=>{const el=$('#pl'+p);if(el){el.innerHTML=prizeListHTML(p);bindPrizes(p)}};
  function bindPrizes(p){
    view.querySelectorAll(`#pl${p} .pz`).forEach(b=>b.addEventListener('click',()=>{
      if(!app.classList.contains('parent-on')){say('Покажи этот приз маме или папе!');return}
      const z=gifts[p].prizes[+b.dataset.i];z.given=!z.given;saveGifts();sfx.tap();refresh(p);
    }));
  }
  [0,1].forEach(p=>{bindSlot($('#gs'+p),p,()=>refresh(p));bindPrizes(p)});
  const pb=$('#pbtn');let holdT=0;
  const stop=()=>{clearTimeout(holdT);pb.classList.remove('hold')};
  pb.addEventListener('pointerdown',()=>{pb.classList.add('hold');holdT=setTimeout(()=>{stop();$('#parea').hidden=false;app.classList.add('parent-on');pb.hidden=true;sfx.good()},1500)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>pb.addEventListener(ev,stop));
  view.querySelectorAll('.rates button').forEach(b=>b.addEventListener('click',()=>{prizeCfg.rate=+b.dataset.r;store.set('prizecfg',prizeCfg);view.querySelectorAll('.rates button').forEach(x=>x.classList.toggle('on',x===b))}));
  view.querySelectorAll('.pcheck input').forEach(c=>c.addEventListener('change',()=>{prizeCfg.on[c.dataset.z]=c.checked;store.set('prizecfg',prizeCfg)}));
  const ps=activePlayers(),waiting=ps.filter(p=>gifts[p].pending>0);
  ask(waiting.length?`${waiting.map(p=>NAMES[p]).join(' и ')}, нажми на подарок, чтобы открыть!`.replace('нажми',waiting.length>1?'нажмите':'нажми'):'Здесь твои подарки. Выигрывай игры — и получишь новые!');
}

/* ---------- saved games: an unfinished round can be continued from the menu ---------- */
const TASKFN={hide:()=>hideTask(),catch:()=>catchTask(),pairs:()=>pairsTurn(),house:()=>houseTurn(),slogi:()=>slogiTask(),first:()=>firstTask(),vowels:()=>vowelTask(),find:()=>findTask(),listen:()=>listenTask(),colors:()=>colorTask(),numbers:()=>numTask()};
function saveSession(){
  if(!TASKFN[S.game])return;
  const {game,mode,ps,turn,lastN,prog,intro,queue,house,boards}=S;
  store.set('session',{game,mode,ps,turn,lastN,prog,intro,queue,house,boards});
}
function savedSession(){const s=store.get('session',null);return s&&TASKFN[s.game]&&GAMES[s.game]&&Array.isArray(s.ps)&&s.ps.length?s:null}
function resumeSession(){
  const s=savedSession();if(!s)return;
  S=Object.assign({shared:false,done:0,total:0,intro:{}},s);
  bar.hidden=false;bHome.hidden=false;bMute.hidden=true;sub.hidden=false;
  TASKFN[s.game]();
}
function menuExtras(){
  const pend=gifts[0].pending+gifts[1].pending,s=savedSession();
  return `<div class="mrow">
    ${s?`<button class="cont" id="cont"><span class="cplay">▶</span><span class="ci">${GAMES[s.game].icon}</span><span class="cl">Продолжить</span><span class="cav">${s.ps.map(p=>pIcons[p]).join('')}</span></button>`:''}
    <button class="giftbtn" id="giftbtn"><span class="gi">🎁</span><span>Подарки</span>${pend?`<b class="gcount">${pend}</b>`:''}</button>
  </div>`;
}
function bindMenuExtras(){
  const c=$('#cont');if(c)c.addEventListener('click',()=>{sfx.tap();resumeSession()});
  $('#giftbtn').addEventListener('click',()=>{sfx.tap();showGifts()});
}

/* ---------- progress kept in the viewer's Claude account (falls back to this browser) ---------- */
const SAVE_KEYS=['stats','toys2','gifts','icons','active','prizecfg','subj','session'];
const rawSet=store.set;
let cloudRef=null,cloudT=0;
store.set=function(k,v){rawSet(k,v);if(k!=='ts'&&k!=='muted'){rawSet('ts',Date.now());cloudSave()}};
function snapshotAll(){const o={};SAVE_KEYS.forEach(k=>{o[k]=store.get(k,null)});return o}
function cloudWrite(){if(!cloudRef)return;cloudRef.set({blob:JSON.stringify(snapshotAll()),ts:store.get('ts',0)}).catch(()=>{})}
function cloudSave(){if(!cloudRef)return;clearTimeout(cloudT);cloudT=setTimeout(cloudWrite,1500)}
function loadAll(){
  stats=store.get('stats',{});if(typeof stats!=='object'||!stats)stats={};
  const ic=store.get('icons',null);if(Array.isArray(ic)&&ic.length===2)pIcons=ic;
  const ac=store.get('active',null);if(Array.isArray(ac)&&ac.length===2&&(ac[0]||ac[1]))active=ac;
  const tb=store.get('toys2',null);if(tb&&Array.isArray(tb[0])&&Array.isArray(tb[1]))toysBy=tb;
  const gf=store.get('gifts',null);if(gf&&gf[0]&&gf[1]&&Array.isArray(gf[0].prizes)&&Array.isArray(gf[1].prizes))gifts=gf;
  const pc=store.get('prizecfg',null);if(pc&&typeof pc.rate==='number'&&pc.on)prizeCfg=pc;
  subj=store.get('subj','math');if(subj!=='rus'&&subj!=='eng')subj='math';
}
(async()=>{
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc('data/users/'+id+'/fabrika');
    const snap=await ref.get();
    const localTs=store.get('ts',0),d=snap.exists?snap.data():null,cloudTs=d?(+d.ts||0):0;
    if(d&&typeof d.blob==='string'&&cloudTs>localTs){
      const o=JSON.parse(d.blob);
      SAVE_KEYS.forEach(k=>{if(o[k]!==undefined&&o[k]!==null)rawSet(k,o[k])});
      rawSet('ts',cloudTs);loadAll();
      if(curScreen==='menu')showMenu('quiet');else if(curScreen==='gifts')showGifts();
    }
    cloudRef=ref;
    if(cloudTs<localTs)cloudWrite();
  }catch(e){}
})();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cloudRef){clearTimeout(cloudT);cloudWrite()}});

/* ---------- bar ---------- */
bHome.addEventListener('click',()=>{sfx.tap();showMenu()});
bEar.addEventListener('click',()=>{sfx.tap();say(lastQ||lastSay)});
sub.addEventListener('click',()=>{say(lastQ||lastSay)});
bMute.addEventListener('click',()=>{muted=!muted;store.set('muted',muted);paintMute();if(muted){try{synth&&synth.cancel()}catch(e){}}else{actx();say('Звук включён!')}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){try{synth&&synth.cancel()}catch(e){}}});
document.addEventListener('contextmenu',e=>e.preventDefault());

showStart();
})();
</script>
