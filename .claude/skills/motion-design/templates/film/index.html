<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>film</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
// Demo film: "Хроники рода Эльтар — Белая кровь", Line Art style (references/styles.md → Line Art).
// Contract for scripts/render.mjs: window.DEMO, window.renderAt(t), window.__ready = true.
import { E, seg, clamp, lerp, invLerp, spring, rng, noise1, polyline, cubicPts, arcPts, makeCanvas, makeGrain, loadCues, TAU } from './mg.js';

const cues = await loadCues('./cues.json');
const { width: W, height: H, fps: FPS, duration: DUR } = cues;
const A = cues.at;                       // beat times in seconds — the same sheet drives audio_kit.py
window.DEMO = { width: W, height: H, fps: FPS, duration: DUR };

const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const ctx = makeCanvas(W, H, stage);
const grain = makeGrain(256, 11);

// ---------- palette (3–6 concrete colours) ----------
const C = { night: '#0B1320', deep: '#060A12', gold: '#E9D7A5', goldDim: '#8C7A4F', white: '#F6F3EC' };
const SERIF = '"Cormorant Garamond", "Noto Serif", "DejaVu Serif", Georgia, serif';
for (const f of [`500 64px ${SERIF}`, `400 40px ${SERIF}`]) { try { await document.fonts.load(f, 'ХРОНИКИ РОДА ЭЛЬТАР БЕЛАЯ КРОВЬ'); } catch {} }

// ---------- one continuous line (the tail of each figure starts the next) ----------
const CX = 960, CY = 430, R = 230;
const pts = [
  ...cubicPts([150, 470], [380, 470], [560, 430], [CX - R, CY], 40),          // horizon sweeps into the ring
  ...arcPts(CX, CY, R, Math.PI, Math.PI + TAU, 160).slice(1),                 // the ring, full turn
  ...cubicPts([CX - R, CY], [CX - R - 60, 250], [CX - 120, 130], [CX, 150], 40).slice(1), // sweeps up to the pommel
  [CX, 712],                                                                  // down the blade to the tip
];
const line = polyline(pts);
const tipPos = line.pointAt(line.total);
const GUARD_Y = 292, GUARD_W = 118;                                           // cross-guard grows out of the blade
const PASS_GUARD = line.L[line.L.length - 2] + (GUARD_Y - 150);              // path length where the pen crosses GUARD_Y
let T_GUARD = A.swordDone;                                                    // time the pen reaches that length (solved once)
for (let k = 0; k <= 2000; k++) { const tt = A.penStart + (A.swordDone - A.penStart) * k / 2000; if (seg(tt, A.penStart, A.swordDone, E.inOut) * line.total >= PASS_GUARD) { T_GUARD = tt; break; } }

// ---------- seeded motes for the end-frame micro-motion ----------
const r = rng(42);
const motes = Array.from({ length: 70 }, () => ({ x: r() * W, y: r() * H, s: 0.6 + r() * 1.8, v: 8 + r() * 22, ph: r() * 10 }));

function drawText(str, x, y, font, color, tracking, t0, t, opts = {}) {
  ctx.font = font; ctx.textBaseline = 'alphabetic';
  const ws = [...str].map(ch => ctx.measureText(ch).width);
  const total = ws.reduce((a, b) => a + b, 0) + tracking * (ws.length - 1);
  let cx = x - total / 2;
  [...str].forEach((ch, i) => {
    const p = seg(t, t0 + i * (opts.stagger ?? 2 / FPS), t0 + i * (opts.stagger ?? 2 / FPS) + (opts.dur ?? 0.7), E.out);
    if (p > 0 && ch !== ' ') {
      ctx.globalAlpha = p * (opts.alpha ?? 1);
      ctx.fillStyle = color;
      ctx.fillText(ch, cx, y + (1 - p) * (opts.rise ?? 26));
    }
    cx += ws[i] + tracking;
  });
  ctx.globalAlpha = 1;
}

window.renderAt = async (t) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // background
  const bg = ctx.createRadialGradient(CX, CY, 50, CX, CY, 1200);
  bg.addColorStop(0, '#111C2E'); bg.addColorStop(0.55, C.night); bg.addColorStop(1, C.deep);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // camera: slow dolly-out (pushed in at the start, settles into the poster composition)
  const cam = lerp(1.14, 1.0, seg(t, 0, A.outro, E.inOut));
  const drift = noise1(t * 0.3, 5) * 4;
  ctx.setTransform(cam, 0, 0, cam, (1 - cam) * CX + drift, (1 - cam) * (CY + 120));

  // ---- the line draw-on ----
  const drawP = seg(t, A.penStart, A.swordDone, E.inOut);
  const head = drawP * line.total;
  const flash = Math.exp(-Math.max(0, t - A.drop) * 6) * (t >= A.drop ? 1 : 0);
  const lineCol = flash > 0.02 ? C.white : C.gold;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 3;
  // older segments dim to ~45 % as the pen moves on, the last 420 px stay bright
  ctx.strokeStyle = C.gold; ctx.globalAlpha = lerp(0.45, 0.9, seg(t, A.fill, A.fill + 0.8));
  line.draw(ctx, 0, head - 420);
  ctx.globalAlpha = 1; ctx.strokeStyle = lineCol;
  ctx.shadowColor = 'rgba(233,215,165,0.55)'; ctx.shadowBlur = 14;
  line.draw(ctx, Math.max(0, head - 420), head);
  ctx.shadowBlur = 0;

  // cross-guard: grows symmetrically from the blade the moment the pen passes it, overshoot + settle
  if (t >= T_GUARD) {
    const gq = spring(t - T_GUARD, 2.6, 0.42);                             // damped spring → overshoot, settle
    const gw = GUARD_W * gq;
    ctx.strokeStyle = lineCol; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(CX - gw, GUARD_Y); ctx.lineTo(CX + gw, GUARD_Y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CX - gw, GUARD_Y - 10 * gq); ctx.lineTo(CX - gw, GUARD_Y + 10 * gq);
    ctx.moveTo(CX + gw, GUARD_Y - 10 * gq); ctx.lineTo(CX + gw, GUARD_Y + 10 * gq); ctx.stroke();
    // pommel diamond
    ctx.beginPath(); ctx.moveTo(CX, 132 - 8 * gq); ctx.lineTo(CX + 9 * gq, 141); ctx.lineTo(CX, 150); ctx.lineTo(CX - 9 * gq, 141); ctx.closePath(); ctx.stroke();
  }

  // pen tip glow (leads the draw, then breathes at the blade tip)
  if (t >= A.penStart) {
    const [px, py] = line.pointAt(head);
    const breathe = 0.75 + 0.25 * Math.sin(t * 2.4);
    const gr = ctx.createRadialGradient(px, py, 0, px, py, 34);
    gr.addColorStop(0, `rgba(255,248,225,${0.9 * breathe})`); gr.addColorStop(1, 'rgba(233,215,165,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(px, py, 34, 0, TAU); ctx.fill();
  }

  // ---- line → fill: the ring fills with gold from its centre ----
  const fp = seg(t, A.fill, A.fill + 0.9, E.out);
  if (fp > 0) {
    const rr = R * fp;
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(1, rr));
    g.addColorStop(0, `rgba(233,215,165,${0.20 + 0.10 * flash})`); g.addColorStop(0.8, 'rgba(233,215,165,0.07)'); g.addColorStop(1, 'rgba(233,215,165,0.0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, rr, 0, TAU); ctx.fill();
    // inner hairline ring
    ctx.strokeStyle = C.goldDim; ctx.lineWidth = 1.2; ctx.globalAlpha = fp * 0.8;
    ctx.beginPath(); ctx.arc(CX, CY, R - 16, -Math.PI / 2, -Math.PI / 2 + TAU * fp); ctx.stroke(); ctx.globalAlpha = 1;
  }

  // ---- hero: a drop of white blood forms at the blade tip, falls, lands, ripples ----
  const [tx, ty] = tipPos, groundY = 772;
  if (t >= A.dropFall && t < A.drop) {
    const grow = clamp(spring(t - A.dropFall, 2.0, 0.5), 0, 1.2);
    const fall = seg(t, A.dropFall + 0.35, A.drop, E.in);
    const y = lerp(ty + 10, groundY - 10, fall);
    const stretch = 1 + fall * 0.35;                       // stretch while falling
    ctx.save(); ctx.translate(tx, y); ctx.scale(1 / Math.sqrt(stretch), stretch);
    ctx.fillStyle = C.white; ctx.shadowColor = 'rgba(255,255,255,0.8)'; ctx.shadowBlur = 18;
    const rd = 9 * grow;
    ctx.beginPath(); ctx.moveTo(0, -rd * 2.2); ctx.quadraticCurveTo(rd * 1.1, -rd * 0.2, 0, rd); ctx.quadraticCurveTo(-rd * 1.1, -rd * 0.2, 0, -rd * 2.2); ctx.fill();
    ctx.restore();
  }
  if (t >= A.drop) {
    const k = t - A.drop;
    // squash on landing (1–3 frames), then ripples
    if (k < 0.12) { ctx.fillStyle = C.white; ctx.beginPath(); ctx.ellipse(tx, groundY, 16 * (1 + k * 8), 5, 0, 0, TAU); ctx.fill(); }
    for (let i = 0; i < 4; i++) {
      const p = seg(t, A.drop + i * 0.16, A.drop + i * 0.16 + 2.4, E.out);
      if (p <= 0) continue;
      ctx.strokeStyle = C.white; ctx.globalAlpha = (1 - p) * 0.85; ctx.lineWidth = 2 - i * 0.3;
      ctx.beginPath(); ctx.ellipse(tx, groundY, 30 + p * (620 - i * 90), (30 + p * (620 - i * 90)) * 0.12, 0, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---- typography ----
  const track = lerp(0.42, 0.2, seg(t, A.title, A.title + 2.2, E.out)) * 64;
  drawText('ХРОНИКИ РОДА ЭЛЬТАР', CX, 868, `500 64px ${SERIF}`, C.gold, track, A.title, t, { stagger: 2 / FPS, dur: 0.8 });
  // subtitle revealed by a centre-out clip wipe
  const wp = seg(t, A.subtitle, A.subtitle + 0.8, E.out);
  if (wp > 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(CX - 400 * wp, 900, 800 * wp, 70); ctx.clip();
    drawText('БЕЛАЯ КРОВЬ', CX, 950, `400 40px ${SERIF}`, C.white, 0.55 * 40, A.subtitle - 1, t, { stagger: 0, dur: 0.01, rise: 0 });
    ctx.restore();
    // hairlines either side of the subtitle
    ctx.font = `400 40px ${SERIF}`;
    const half = [...'БЕЛАЯ КРОВЬ'].reduce((s, ch) => s + ctx.measureText(ch).width, 0) / 2 + 0.55 * 40 * 5 + 36;
    ctx.strokeStyle = C.goldDim; ctx.lineWidth = 1; const hl = 140 * wp;
    ctx.beginPath(); ctx.moveTo(CX - half, 937); ctx.lineTo(CX - half - hl, 937); ctx.moveTo(CX + half, 937); ctx.lineTo(CX + half + hl, 937); ctx.stroke();
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // ---- motes (end-frame micro-motion) ----
  const ma = seg(t, A.drop, A.outro + 0.5, E.out);
  if (ma > 0) for (const m of motes) {
    const y = ((m.y - t * m.v) % H + H) % H, x = m.x + Math.sin(t * 0.7 + m.ph) * 10;
    ctx.globalAlpha = ma * (0.25 + 0.35 * Math.sin(t * 1.3 + m.ph) ** 2);
    ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(x, y, m.s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- flash on the hero hit ----
  if (flash > 0.01) { ctx.fillStyle = `rgba(255,252,240,${0.22 * flash})`; ctx.fillRect(0, 0, W, H); }

  // ---- finishing: vignette + grain (only where the style wants it) ----
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  grain(ctx, t, FPS, W, H, 0.05);
};

await window.renderAt(0);
window.__ready = true;
</script>
</body>
</html>
